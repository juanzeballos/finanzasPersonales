<script>
  const DOCS = ["# 📚 Capacitación: Programación orientada a eventos\n\n## Pasarela de pagos GWP (\"GiveMeMoney\")\n\n> Documento autoguiado, por etapas, pensado para **imprimir y leer durante la semana**.\n> Después vas a contrastar todo esto con el código real cuando tengas acceso al repo.\n\n---\n\n### ⚠️ Antes de empezar: dos aclaraciones honestas\n\n1. **Versiones:** la documentación interna menciona **Java 21 / Spring Boot 3.5**. Vos creías que podía ser Java 23. Como este material se armó **sin acceso al repositorio**, uso **Java 21 / Spring Boot 3.5 como referencia**. Es un dato a **confirmar** mirando los archivos de build (`pom.xml` o `build.gradle`, la propiedad `<java.version>` / `sourceCompatibility`) cuando entres al código.\n\n2. **Nombres de código:** este documento **no inventa** nombres de clases, paquetes ni rutas de archivos. Los **exchanges, colas y eventos** sí son los reales (figuran en la doc de arquitectura). Cuando te diga \"buscá la clase de configuración de RabbitMQ\", es a propósito genérico: el nombre exacto lo confirmás vos en el repo.\n\n---\n\n### 🎯 Para qué es esta capacitación\n\nVenís de monolitos Spring sincrónicos: un request entra, viajás por capas, llamás servicios, golpeás la base, devolvés respuesta — todo en el mismo hilo, todo \"ahora\". GWP es otra cosa: **microservicios que se hablan por eventos**, asíncronos y desacoplados, sobre RabbitMQ. El objetivo de la semana es que cuando abras el código no veas magia, sino patrones que ya entendés.\n\nNo te voy a explicar lo que ya sabés (qué es un `@Service`, un hilo, una transacción). Me concentro en lo nuevo: **mensajería, asincronía, hexagonal/CQRS, Outbox, consistencia eventual e infraestructura K8s**.\n\n---\n\n### 🗺️ Mapa del documento\n\n| # | Etapa | Archivo | Lectura |\n|---|-------|---------|:---:|\n| 📑 | **Índice** (este archivo) | `00-indice.md` | 5 min |\n| 0 | **Por qué eventos** | `etapa-0-por-que-eventos.md` | 15 min |\n| 1 | **Vocabulario de mensajería** | `etapa-1-vocabulario-mensajeria.md` | 20 min |\n| 2 | **RabbitMQ en este proyecto** | `etapa-2-rabbitmq-en-el-proyecto.md` | 25 min |\n| 3 | **Hexagonal + Clean + CQRS** | `etapa-3-hexagonal-clean-cqrs.md` | 30 min |\n| 4 | **Recorrido de los 4 microservicios** | `etapa-4-recorrido-microservicios.md` | 35 min |\n| 5 | **Patrones que tenés que entender sí o sí** | `etapa-5-patrones.md` | 35 min |\n| 6 | **Flujos end-to-end** | `etapa-6-flujos-end-to-end.md` | 40 min |\n| 7 | **Infraestructura y \"verlo correr\"** | `etapa-7-infraestructura.md` | 30 min |\n| 8 | **Consolidar** | `etapa-8-consolidar.md` | 20 min |\n| A | **Apéndice — Fundamentos de Docker y Kubernetes** | `apendice-A-fundamentos-docker-k8s.md` | 35 min |\n| ✅ | **Respuestas** | `99-respuestas.md` | — |\n\n**Total:** ~5 h 25 min de lectura.\n\n> 📎 **Sobre el Apéndice A:** la Etapa 7 te enseña a *operar* la infraestructura; el Apéndice A te enseña a *entender la maquinaria* (contenedores, labels/selectors, DNS interno, PV/PVC, Minikube) desde cero. Si nunca tocaste Docker/K8s, leelo **junto con** la Etapa 7 (o justo antes).\n\n---\n\n### 🧭 Cómo está armada cada etapa\n\nTodas siguen la **misma estructura**, a propósito, para que estudies con ritmo:\n\n1. **🎯 Objetivo** — qué te llevás, en 2-3 líneas.\n2. **📖 Teoría** — explicación didáctica. **Analogía con Java/Spring primero, código después.**\n3. **🔍 En nuestro sistema** — el mapeo a GWP con los nombres reales.\n4. **📂 Qué buscar en el código (para la semana)** — qué tipo de archivo abrir cuando tengas el repo.\n5. **❓ Preguntas para verificar** — 3 a 5; las respuestas están todas juntas en `99-respuestas.md`.\n6. **✍️ Mini-ejercicio** — lectura y trazado mental, no escribir el sistema.\n\n---\n\n### 🗓️ Ruta sugerida para la semana\n\n| Día | Etapas | Idea |\n|-----|--------|------|\n| **Lunes** | 0 + 1 | El *porqué* y el vocabulario base |\n| **Martes** | 2 + 3 | RabbitMQ concreto + organización de capas |\n| **Miércoles** | 4 | Los 4 servicios, de una sentada |\n| **Jueves** | 5 + 6 | Patrones + flujos completos (el corazón del sistema) |\n| **Viernes** | 7 + Apéndice A + 8 | Infra (operar + entender la maquinaria) y cierre |\n| **Finde** | repaso | Preguntas de verificación + mini-ejercicios |\n\n---\n\n### 🏗️ Vista de pájaro del sistema (para tener a mano)\n\nGWP permite a las **salas de juego** procesar pagos electrónicos vía proveedores como **MercadoPago**. Recibe solicitudes, genera órdenes QR, captura confirmaciones por webhook y notifica a los clientes — **todo asíncrono y desacoplado**.\n\n**4 microservicios:**\n\n- **api-gateway** — único punto de entrada HTTP, *stateless*, sin BD. Valida y convierte requests en eventos que publica a RabbitMQ. Responde `202`/`200` sin bloquear.\n- **payment-service** — el orquestador central (*Aggregate Root*), 100% event-driven, sin HTTP. Consume 9 colas, persiste en PostgreSQL, publica a 6 exchanges. Implementa **Transactional Outbox** y tiene schedulers internos.\n- **mercadopago-adapter** — adaptador de salida hacia la API de MercadoPago. *Stateless*, valida webhooks con HMAC-SHA256, reintentos con DLQ.\n- **notification-service** — adaptador de salida HTTP: convierte eventos en POST firmados hacia los webhooks de cada cliente, con backoff exponencial.\n\n```mermaid\nflowchart LR\n    Cliente[Sala de juego] -->|HTTP| NGINX[Nginx]\n    NGINX --> GW[api-gateway]\n    GW -->|eventos| MQ((RabbitMQ))\n    MQ <--> PS[payment-service]\n    PS --- DB[(PostgreSQL 16)]\n    MQ <--> MPA[mercadopago-adapter]\n    MPA -->|REST| MP[MercadoPago]\n    MQ --> NS[notification-service]\n    NS -->|HTTP POST firmado| Cliente\n```\n\n> El diagrama es la postal. En la **Etapa 6** lo recorremos mensaje por mensaje.\n\n---\n\n**Siguiente:** `etapa-0-por-que-eventos.md`\n","# Etapa 0 — Por qué eventos\n\n## 🎯 Objetivo de la etapa\n\nEntender **por qué** un sistema de pagos como GWP se construye orientado a eventos en lugar de como un monolito sincrónico. Que al terminar puedas explicarle a otro las cuatro razones de fondo: **acoplamiento, escalado, tolerancia a fallos y asincronía**.\n\n---\n\n## 📖 Teoría\n\nPensá en cómo resolverías esto con lo que ya sabés. Te piden: \"cuando llega una solicitud de pago, generá una orden QR en MercadoPago, guardá todo en la base, y cuando MercadoPago confirme el pago, avisale al cliente por su webhook\".\n\n### Cómo lo harías en un monolito Spring clásico\n\nUn `@RestController` recibe el `POST`, llama a un `@Service`, que dentro de la **misma transacción y el mismo hilo**:\n\n```java\n// Monolito sincrónico clásico — todo en un request\n@PostMapping(\"/payments\")\npublic PaymentResponse crear(@RequestBody PaymentRequest req) {\n    Order order = orderService.crear(req);           // 1. lógica de negocio\n    MpOrder mpOrder = mercadoPagoClient.crearOrden(order); // 2. llamada REST bloqueante\n    order.setQr(mpOrder.getQr());\n    orderRepository.save(order);                      // 3. persistencia\n    return PaymentResponse.from(order);               // 4. respondo YA, con todo resuelto\n}\n```\n\nEsto funciona, lo hiciste mil veces, y para muchos sistemas está perfecto. Pero mirá las costuras cuando el sistema crece:\n\n**1. Acoplamiento temporal.** El paso 2 es una llamada HTTP bloqueante a MercadoPago. Si MercadoPago tarda 4 segundos, tu request tarda 4 segundos. Si MercadoPago está caído, **tu endpoint falla**, aunque la solicitud del cliente era perfectamente válida y la podrías haber procesado más tarde. Tu disponibilidad quedó atada a la de un tercero.\n\n**2. Escalado en bloque.** Si te llueven webhooks de confirmación pero pocas solicitudes nuevas, no podés escalar \"solo la parte de webhooks\": escalás el monolito entero. Pagás CPU y memoria de todo para resolver el cuello de botella de una parte.\n\n**3. Tolerancia a fallos.** Si el paso 4 (notificar al cliente) falla, ¿qué hacés? ¿Rollback de todo el pago que ya está confirmado en MercadoPago? No podés: el dinero ya se movió. Mezclar \"cobrar\" con \"avisar\" en una sola transacción te deja en estados imposibles.\n\n**4. Asincronía forzada a mano.** Para no bloquear, terminás metiendo `@Async`, `ExecutorService`, `CompletableFuture`, colas en memoria con `BlockingQueue`… y reinventás, mal y sin durabilidad, lo que un broker de mensajería te da hecho. Si el proceso se cae, tu `BlockingQueue` en memoria se perdió.\n\n### El cambio de mentalidad: del \"llamar\" al \"avisar\"\n\nEn event-driven dejás de **llamar** a quien sigue y pasás a **avisar que pasó algo**. El api-gateway no le dice al payment-service \"hacé esto\"; **publica un hecho**: *\"se recibió una solicitud de pago\"* (`OnPaymentRequestReceivedEvent`). Quién lo escucha, cuándo y qué hace con eso, es problema del consumidor.\n\n> **Analogía:** en el monolito sos un gerente que llama por teléfono a cada empleado y espera en la línea hasta que termina. En event-driven dejás una **nota en un casillero** (la cola) y seguís con lo tuyo. El empleado la toma cuando puede. Si está de licencia, la nota lo espera. Si hay mucho trabajo, ponés tres empleados a vaciar el mismo casillero.\n\nEsa \"nota en el casillero\" es **durable** (sobrevive a reinicios), **desacoplada** (el que avisa no conoce al que procesa) y permite **escalar por casillero** (agregás consumidores donde se acumula trabajo).\n\n### Lo que ganás, punto por punto\n\n| Problema del monolito | Cómo lo resuelve event-driven |\n|---|---|\n| Acoplamiento temporal | El gateway publica y responde `202` al instante; no espera a MercadoPago |\n| Escalado en bloque | Escalás el servicio (o los consumidores de una cola) que está saturado |\n| Fallos en cascada | Si un servicio se cae, los mensajes esperan en la cola; nada se pierde |\n| Asincronía artesanal | El broker te da durabilidad, reintentos y entrega garantizada |\n\n### Lo que pagás a cambio (que no te mientan)\n\nNo es gratis. Aceptás **consistencia eventual** (el estado no es coherente en todos lados *en el mismo instante*, sino *al rato*), **debugging distribuido** (un flujo cruza 4 servicios y RabbitMQ), y **complejidad operativa** (K8s, broker, observabilidad). GWP asume ese costo a propósito: en pagos, **no perder un mensaje** y **no quedar atado a la caída de un proveedor** vale más que la simplicidad de un monolito.\n\n---\n\n## 🔍 En nuestro sistema\n\nGWP lleva esta idea al extremo sano:\n\n- El **api-gateway** no tiene base de datos ni lógica de negocio pesada. Recibe el `POST /api/v1/payments`, valida, lo transforma en `OnPaymentRequestReceivedEvent`, lo publica al exchange `on_new_payment_request` y responde **`202 Accepted`** sin esperar nada más. Le dijo al sistema \"esto pasó\" y se desentendió.\n- El **payment-service** consume ese evento *cuando puede*, decide qué hacer, persiste, y emite **nuevos eventos** para que el `mercadopago-adapter` cree la orden y el `notification-service` avise al cliente. Nadie llama a nadie: **todos reaccionan a hechos**.\n- Si MercadoPago está caído, el evento queda en la cola del adapter y se reintenta (con DLQ). El cliente que pidió el pago **ya recibió su `202`** hace rato.\n\nEse `202` es la diferencia filosófica con tu monolito: **\"recibí tu pedido y me hago cargo\"**, en vez de **\"esperá en la línea que lo resuelvo entero ahora\"**.\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\nTodavía no necesitás el repo, pero anotá para después:\n\n- En el **api-gateway**, los controllers de entrada: fijate que los métodos **no devuelven el resultado del negocio**, sino un `202`/`200` casi inmediato. Eso confirma el desacople.\n- Buscá dónde el gateway **publica** a RabbitMQ en vez de llamar a otro servicio por REST. Ese es el corazón del cambio.\n- En el **payment-service**, fijate que **no hay controllers HTTP**: toda su entrada son métodos que reaccionan a mensajes. Un servicio que \"no tiene puerta HTTP\" es algo que en tu mundo monolítico no existía.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. En el monolito, ¿por qué la disponibilidad de tu endpoint de pagos queda atada a la de MercadoPago? ¿Cómo rompe GWP esa atadura?\n2. ¿Qué significa que el api-gateway responda `202 Accepted` en lugar de `200 OK` con el pago ya resuelto?\n3. Nombrá los cuatro problemas del monolito sincrónico que el enfoque event-driven ataca.\n4. ¿Cuál es el principal **costo** que aceptás al irte a event-driven, y por qué en un sistema de pagos vale la pena?\n5. ¿Por qué una `BlockingQueue` en memoria con un `Executor` **no** es equivalente a usar RabbitMQ?\n\n---\n\n## ✍️ Mini-ejercicio\n\nTomá el código del monolito de arriba (`crear(...)`). En una hoja, **marcá con una cruz cada punto donde una falla dejaría el sistema en un estado inconsistente o indisponible** (ej.: MercadoPago caído, la base no responde, el cliente no recibe el aviso). Después, al lado de cada cruz, escribí en una línea **quién se haría cargo de ese paso en GWP** (qué servicio) y **qué pasaría con el mensaje si ese servicio estuviera caído**. No escribas código: es trazado mental.\n\n---\n\n**Siguiente:** `etapa-1-vocabulario-mensajeria.md`\n","# Etapa 1 — Vocabulario de mensajería\n\n## 🎯 Objetivo de la etapa\n\nQuedarte con el vocabulario base de mensajería **bien claro**, porque todo lo demás se apoya acá: evento, mensaje, cola, exchange, routing key, binding, productor/consumidor, ack/nack, prefetch y DLQ. Y entender los **tres tipos de exchange** (fanout, topic, direct) con los exchanges reales de GWP como ejemplo.\n\n---\n\n## 📖 Teoría\n\n### Evento vs mensaje\n\n- Un **evento** es un *hecho de negocio que ya pasó*: \"se recibió una solicitud de pago\", \"se confirmó un pago\". Es conceptual, inmutable, en pasado.\n- Un **mensaje** es el *sobre* que transporta ese evento por el broker: bytes (normalmente JSON) + metadatos (headers, routing key). El evento es el contenido; el mensaje es el envío.\n\n> En tu mundo: el **evento** es el DTO/`record` con los datos del hecho; el **mensaje** es ese DTO ya serializado y metido en un sobre de RabbitMQ con su etiqueta de ruteo.\n\n### Las piezas de RabbitMQ\n\nRabbitMQ implementa el protocolo **AMQP**. Tres piezas y cómo se relacionan:\n\n- **Exchange** — la \"central de correo\". El productor **nunca** publica directo a una cola: publica a un *exchange*, que decide a qué cola(s) mandar el mensaje.\n- **Queue (cola)** — el casillero durable donde el mensaje espera a ser consumido. Es lo único que los consumidores leen.\n- **Binding** — la \"regla de ruteo\" que conecta un exchange con una cola. Puede llevar una condición (un patrón de routing key).\n\n```mermaid\nflowchart LR\n    P[Productor] -->|publish + routing key| X{Exchange}\n    X -->|binding| Q1[(Cola A)]\n    X -->|binding| Q2[(Cola B)]\n    Q1 --> C1[Consumidor A]\n    Q2 --> C2[Consumidor B]\n```\n\n- **Routing key** — etiqueta que el productor le pone al mensaje. El exchange la compara contra los bindings para decidir el ruteo. En GWP, por ejemplo, la routing key del webhook es el **código del proveedor** (`providerCode`).\n- **Productor / Consumidor** — quién publica y quién lee. En GWP el api-gateway es casi puro productor; el payment-service es las dos cosas (consume 9 colas, publica a 6 exchanges).\n\n> **Analogía Spring:** un `@RabbitListener` sobre una cola es, conceptualmente, como un consumidor que está dando vueltas tomando ítems de un `BlockingQueue` con un `Executor` dedicado — solo que la cola es **durable** (vive en el broker, no en tu heap), está **fuera de tu proceso**, y la entrega está **garantizada** por el protocolo.\n\n### Ack / Nack: el apretón de manos\n\nEsto es clave y no existe en una `BlockingQueue` común. Cuando un consumidor toma un mensaje, el broker **no lo borra todavía**: lo marca como \"en vuelo\". El consumidor procesa y después:\n\n- **ack** (acknowledge): \"lo procesé bien, borralo\". Recién ahí desaparece de la cola.\n- **nack** (negative ack): \"no pude / falló\". Según la config, el mensaje se **re-encola** (reintento) o se manda a la **DLQ**.\n\nSi el consumidor **se cae antes de hacer ack**, el broker nota que la conexión murió y **vuelve a poner el mensaje en la cola** para que otro lo tome. Por eso decimos que la entrega es **at-least-once** (al menos una vez): el mensaje no se pierde, pero **puede llegar dos veces** (lo procesaste, te caíste antes del ack, y te lo redan). De ahí la importancia de la **idempotencia** — la vemos en la Etapa 5.\n\n### Prefetch: cuántos mensajes \"en mano\" a la vez\n\nEl **prefetch** (`prefetch count`) limita cuántos mensajes sin-ack puede tener un consumidor en vuelo simultáneamente. Si es 1, el broker no te manda el siguiente hasta que hagas ack del actual: reparto parejo, ideal para tareas pesadas. Si es alto, el consumidor \"acapara\" muchos y procesa más rápido, pero si se cae, más mensajes vuelven a la cola.\n\n> En tu mundo es como el **tamaño del lote** que un worker saca de la cola antes de volver a pedir. Prefetch bajo = justo a tiempo y reparto equitativo; prefetch alto = throughput pero menos balanceo.\n\n### DLQ — Dead Letter Queue\n\nLa **cola de los muertos**. Si un mensaje falla repetidas veces (o se rechaza sin re-encolar, o expira), en vez de perderse o girar para siempre, se desvía a una **DLQ**. Ahí queda para que alguien lo inspeccione: ¿por qué falló?, ¿lo reproceso a mano?, ¿es un bug? Es tu red de seguridad contra el \"veneno\" (un mensaje que rompe siempre y bloquearía la cola si girara infinito).\n\n### Los tres tipos de exchange\n\nAcá está la decisión de diseño que más vas a ver. El **tipo de exchange** define *cómo* rutea:\n\n#### 1. `fanout` — a todos, sin mirar la routing key\n\nCopia el mensaje a **todas** las colas atadas a él. Ignora por completo la routing key. Es \"broadcast\".\n\n> **Cuándo:** un mismo hecho le interesa a varios consumidores y no querés que el productor sepa cuántos son. Agregás un consumidor nuevo **atando otra cola** al exchange, sin tocar al productor.\n\nEn GWP: `on_new_payment_request` es **fanout, routing key `\"\"`** (vacía, justamente porque no se usa). El gateway publica \"llegó una solicitud\" y el sistema decide quién la consume — sin que el gateway lo sepa.\n\n#### 2. `topic` — por patrón de routing key\n\nRutea comparando la routing key contra **patrones** en los bindings, usando comodines: `*` (una palabra) y `#` (cero o más palabras), separadas por puntos. Flexible y declarativo.\n\n> **Cuándo:** el mismo exchange recibe mensajes de distintas \"categorías\" y querés que cada cola se suscriba a un subconjunto.\n\nEn GWP: `on_new_webhook_notification` es **topic, con routing key = `providerCode`**. Así, las notificaciones de MercadoPago (`providerCode` de MP) pueden rutearse a la cola del adapter correcto, y mañana otro proveedor rutea a otro lado — **sin tocar al gateway**, solo agregando un binding.\n\n#### 3. `direct` — por coincidencia exacta de routing key\n\nRutea a las colas cuyo binding tenga **exactamente** la misma routing key del mensaje. Sin comodines. Es el punto medio: más dirigido que fanout, más simple que topic.\n\n> **Cuándo:** querés mandar a una cola específica según una clave exacta y previsible.\n\n**Resumen mental:**\n\n| Tipo | Mira la routing key | Reparte a… | Metáfora |\n|------|:---:|---|---|\n| `fanout` | No | todas las colas atadas | altavoz / lista de difusión |\n| `topic` | Sí, por patrón (`*`, `#`) | las que matcheen el patrón | suscripción por temas |\n| `direct` | Sí, exacta | las que tengan esa key exacta | sobre con destinatario puntual |\n\n---\n\n## 🔍 En nuestro sistema\n\nExchanges reales que ya conocés del contexto, y qué tipo son:\n\n- **`on_new_payment_request`** — `fanout`, routing key `\"\"`. El gateway difunde \"llegó una solicitud de pago\". Fanout porque al gateway no le importa quién la consume.\n- **`on_new_webhook_notification`** — `topic`, routing key = `providerCode`. Rutea la notificación según el proveedor que la mandó.\n- **`on_new_cancel_order_request`** y **`on_new_refund_order_request`** — los otros dos puntos de entrada del gateway (cancelación y reembolso).\n- **`on_notification_attempt_completed`** — exchange de **auditoría** que publica el notification-service: registra el resultado de cada intento de notificación al cliente.\n\nY las piezas conceptuales aparecen así:\n- **Productor puro:** api-gateway.\n- **Productor + consumidor:** payment-service (9 colas in, 6 exchanges out) y mercadopago-adapter (6 colas in, 5 exchanges out).\n- **DLQ + reintentos:** el mercadopago-adapter los usa explícitamente para tolerar fallas de la API de MercadoPago.\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- La **clase de configuración de RabbitMQ** (la que declara los `Exchange`, `Queue` y `Binding` como `@Bean`). Ahí vas a ver, en código, el **tipo** de cada exchange (`FanoutExchange`, `TopicExchange`, `DirectExchange`) y los bindings con sus routing keys.\n- Buscá dónde se configura la **DLQ**: típicamente argumentos como `x-dead-letter-exchange` al declarar la cola, o beans de exchange/cola con \"dlq\"/\"dead-letter\" en el nombre.\n- Buscá dónde se setea el **prefetch** (suele estar en `application.yml`/`.properties` como `spring.rabbitmq.listener.simple.prefetch`, o en la config del container factory).\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. ¿Por qué un productor publica a un **exchange** y no directamente a una cola? ¿Qué gana con esa indirección?\n2. `on_new_payment_request` es `fanout` con routing key `\"\"`. ¿Por qué la routing key está vacía y qué implica para agregar un nuevo consumidor?\n3. ¿Qué diferencia hay entre que el payment-service haga **ack** o **nack** de un mensaje? ¿Qué pasa si se cae **antes** de cualquiera de los dos?\n4. Explicá con tus palabras por qué \"at-least-once\" obliga a pensar en idempotencia.\n5. ¿Para qué sirve una DLQ y qué problema concreto evita (pista: mensaje \"veneno\")?\n\n---\n\n## ✍️ Mini-ejercicio\n\nDibujá en una hoja los tres exchanges de entrada del gateway (`on_new_payment_request`, `on_new_webhook_notification`, y uno de cancel/refund). Para cada uno, anotá: **(a)** su tipo de exchange, **(b)** qué routing key usaría el productor, y **(c)** en una frase, por qué ese tipo es el adecuado para ese caso. Para el webhook, inventá un segundo proveedor ficticio y mostrá **qué tendrías que agregar** (sin tocar el gateway) para que sus notificaciones vayan a otra cola.\n\n---\n\n**Siguiente:** `etapa-2-rabbitmq-en-el-proyecto.md`\n","# Etapa 2 — RabbitMQ en este proyecto\n\n## 🎯 Objetivo de la etapa\n\nBajar el vocabulario de la Etapa 1 a **cómo se ve en Spring**: cómo se declaran exchanges/colas/bindings, cómo un método se vuelve consumidor con `@RabbitListener`, cómo viaja el JSON, y cómo **ver todo esto funcionando** en la UI de Management de RabbitMQ.\n\n> Recordá: los snippets son **ilustrativos**. El código real de GWP puede diferir en nombres y detalles; lo confirmás cuando tengas el repo.\n\n---\n\n## 📖 Teoría\n\n### Declarar la topología desde Spring\n\nEn Spring AMQP (`spring-boot-starter-amqp`), la topología — exchanges, colas, bindings — se declara como **beans**. Cuando la app arranca, un `RabbitAdmin` los crea en el broker si no existen. Esto es lindo: la infraestructura de mensajería vive **en el código**, versionada, no en clicks manuales en la UI.\n\n```java\n// Ejemplo ILUSTRATIVO — el código real puede variar\n@Configuration\npublic class RabbitConfig {\n\n    // Un exchange fanout: difunde a todas las colas atadas\n    @Bean\n    FanoutExchange onNewPaymentRequestExchange() {\n        return new FanoutExchange(\"on_new_payment_request\");\n    }\n\n    // Una cola durable (sobrevive reinicios del broker)\n    @Bean\n    Queue paymentRequestQueue() {\n        return QueueBuilder.durable(\"payment_request_queue\").build();\n    }\n\n    // El binding: conecta la cola al exchange.\n    // En fanout no hace falta routing key.\n    @Bean\n    Binding bindPaymentRequest(Queue paymentRequestQueue,\n                               FanoutExchange onNewPaymentRequestExchange) {\n        return BindingBuilder.bind(paymentRequestQueue)\n                             .to(onNewPaymentRequestExchange);\n    }\n}\n```\n\nPara un **topic exchange** el binding lleva un patrón de routing key:\n\n```java\n// Ejemplo ILUSTRATIVO de topic — webhook por proveedor\n@Bean TopicExchange webhookExchange() {\n    return new TopicExchange(\"on_new_webhook_notification\");\n}\n\n@Bean Binding bindMercadoPagoWebhook(Queue mpWebhookQueue, TopicExchange webhookExchange) {\n    // routing key = providerCode; acá matchea exactamente el de MercadoPago\n    return BindingBuilder.bind(mpWebhookQueue).to(webhookExchange).with(\"mercadopago\");\n}\n```\n\n> **Mentalidad:** declarar un `Queue`/`Exchange`/`Binding` bean es como registrar la \"cañería\". No procesa nada; solo dice *cómo está conectado el sistema de correo*. El procesamiento viene aparte, con el listener.\n\n### Publicar un mensaje\n\nEl productor usa `RabbitTemplate`. Le das **exchange + routing key + payload**:\n\n```java\n// Ejemplo ILUSTRATIVO — publicar el evento\nrabbitTemplate.convertAndSend(\n    \"on_new_payment_request\",   // exchange\n    \"\",                         // routing key (vacía: es fanout)\n    event                       // objeto -> se serializa a JSON (ver más abajo)\n);\n```\n\n`convertAndSend` aplica un **MessageConverter** para transformar tu objeto Java en bytes. El gateway hace exactamente esto: arma el `OnPaymentRequestReceivedEvent` y lo manda al exchange.\n\n### Consumir: `@RabbitListener`\n\nUn método anotado con `@RabbitListener` se ata a una cola. Spring levanta un *listener container* (con su pool de hilos) que **escucha la cola y entrega los mensajes a tu método**. Cuando el método retorna normalmente, Spring hace **ack**; si lanza excepción, hace **nack** (y según config, re-encola o manda a DLQ).\n\n```java\n// Ejemplo ILUSTRATIVO — un consumidor\n@RabbitListener(queues = \"payment_request_queue\")\npublic void onPaymentRequest(OnPaymentRequestReceivedEvent event) {\n    // el JSON ya se deserializó al record/clase del evento\n    paymentUseCase.handle(event);\n    // si retorna sin excepción -> ACK automático\n    // si lanza -> NACK -> reintento o DLQ\n}\n```\n\n> **La analogía clave:** el *listener container* es tu `Executor` dedicado, la cola es tu `BlockingQueue` — pero durable y fuera del proceso —, y el `@RabbitListener` es el `Runnable` que corre por cada ítem. La diferencia enorme: el **ack** te da entrega garantizada. Con un `BlockingQueue`, si el worker explota a mitad, el ítem se perdió. Acá vuelve a la cola.\n\n### Serialización: JSON por el medio\n\nLos servicios no comparten objetos Java en memoria: comparten **JSON** por el cable. Se configura un `MessageConverter` (típicamente `Jackson2JsonMessageConverter`) como bean, y a partir de ahí `convertAndSend` serializa a JSON al publicar y `@RabbitListener` deserializa de JSON al consumir.\n\nEsto importa por dos razones prácticas:\n1. **Contrato entre servicios:** el evento es un contrato. Si cambiás un campo de un `record` de evento en un servicio, todos los que lo consumen tienen que entender la nueva forma. Versionar eventos es un tema real.\n2. **`record` inmutables:** GWP usa `record` para commands/events. Jackson sabe deserializar `record` desde Java 16+, así que el evento viaja como JSON y revive como `record` inmutable del otro lado.\n\n### Concurrencia y prefetch en Spring\n\nEn el `application.yml` se ajusta cuántos consumidores concurrentes hay por listener y el prefetch:\n\n```yaml\n# Ejemplo ILUSTRATIVO\nspring:\n  rabbitmq:\n    listener:\n      simple:\n        concurrency: 1          # consumidores mínimos por listener\n        max-concurrency: 5      # máximo si hay backlog\n        prefetch: 10            # mensajes en vuelo por consumidor\n        acknowledge-mode: auto  # ack/nack según retorno/excepción del método\n```\n\n---\n\n## 🔍 En nuestro sistema\n\n- El **api-gateway** es el productor de los 4 exchanges de entrada: publica con `RabbitTemplate` (o equivalente) hacia `on_new_payment_request`, `on_new_webhook_notification`, `on_new_cancel_order_request`, `on_new_refund_order_request`.\n- El **payment-service** tiene **9 métodos consumidores** (una cola cada uno, conceptualmente) y publica a **6 exchanges**. Es el que más topología toca.\n- El **mercadopago-adapter** consume 6 colas y publica 5 exchanges; además declara **DLQ** para las fallas contra MercadoPago.\n- El **notification-service** consume 2 colas y publica 1 exchange de auditoría (`on_notification_attempt_completed`).\n- El broker es **RabbitMQ** sobre AMQP (`5672`), con **UI de Management en `15672`**, corriendo como `StatefulSet rabbitmq-0` en Kubernetes.\n\n### Ver todo esto en la UI de Management\n\nLa UI de Management (puerto `15672`) es tu mejor amiga para entender el sistema sin leer una línea de código:\n\n- **Exchanges:** ves los 6+ exchanges, su **tipo** (fanout/topic/direct) y sus bindings. Acá confirmás de un vistazo que `on_new_payment_request` es fanout.\n- **Queues:** ves cada cola, **cuántos mensajes tiene encolados**, cuántos están \"en vuelo\" (unacked), y la tasa de entrada/salida. Si una cola crece y no baja → consumidor caído o lento.\n- **Bindings:** ves qué cola está atada a qué exchange con qué routing key.\n- Podés incluso **publicar un mensaje a mano** desde la UI para probar un consumidor.\n\nPara llegar ahí en el entorno de GWP (lo retomamos en la Etapa 7):\n\n```bash\nkubectl port-forward -n dev svc/rabbitmq-service 15672:15672\n# luego abrís http://localhost:15672 en el navegador\n```\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- La **clase de configuración de RabbitMQ** de cada servicio: los `@Bean` de `Exchange`, `Queue`, `Binding`. Es el mapa de la topología.\n- El **bean del `MessageConverter`** (buscá `Jackson2JsonMessageConverter` o similar): confirma que el transporte es JSON.\n- Los **métodos `@RabbitListener`**: son los puntos de entrada reales de los servicios event-driven. Contá cuántos hay en el payment-service (deberían ser ~9).\n- Dónde se usa el **`RabbitTemplate`** (o un wrapper): ahí está la publicación de eventos.\n- El **`application.yml`/`.properties`**: `concurrency`, `prefetch`, `acknowledge-mode`, y la conexión al broker.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. ¿Qué hace un `@Bean` de tipo `Queue`/`Exchange`/`Binding` cuando arranca la app, y por qué conviene declarar la topología en código y no a mano en la UI?\n2. ¿Quién hace el **ack** cuando usás `@RabbitListener` con `acknowledge-mode: auto`, y qué pasa si tu método lanza una excepción?\n3. ¿Por qué los servicios intercambian **JSON** y no objetos Java directamente? ¿Qué implica eso para cambiar un campo de un evento?\n4. Si entrás a la UI de Management y ves una cola con 5.000 mensajes encolados y 0 unacked, ¿qué sospechás?\n5. ¿Para qué sirve `max-concurrency` y cómo se relaciona con el escalado que vimos en la Etapa 0?\n\n---\n\n## ✍️ Mini-ejercicio\n\nTomá el snippet ilustrativo del `@RabbitListener` de arriba. Anotá, paso a paso, **el ciclo de vida de un mensaje** desde que está en la cola hasta que desaparece: (1) el container lo toma, (2) se deserializa el JSON, (3) corre tu método, (4) ack/nack. En cada paso, escribí **qué pasaría si el servicio se cae justo ahí**. ¿En qué paso(s) el mensaje se reprocesaría y por qué?\n\n---\n\n**Siguiente:** `etapa-3-hexagonal-clean-cqrs.md`\n","# Etapa 3 — Hexagonal + Clean + CQRS\n\n## 🎯 Objetivo de la etapa\n\nEntender **cómo está organizado por dentro** cada microservicio de GWP: las capas `domain` / `application` / `adapters`, los puertos de entrada y salida, la regla de dependencias hacia adentro, y por qué los **commands** están separados de los **events** y las **queries** (CQRS). Que veas que no es decoración: resuelve problemas concretos de testeo y de cambio.\n\n---\n\n## 📖 Teoría\n\n### El problema que resuelve la arquitectura hexagonal\n\nEn el monolito clásico, ¿dónde vive la lógica de negocio? Muchas veces, mezclada con Spring, con JPA, con el cliente HTTP. El `@Service` importa `@Repository` (JPA), arma queries, llama clientes REST… y entonces tu **lógica de negocio depende de la base de datos, del framework y del proveedor externo**. Testearla te obliga a levantar media infraestructura, y cambiar de proveedor te obliga a tocar el corazón del negocio.\n\nLa **arquitectura hexagonal** (también \"Ports & Adapters\") da vuelta esa dependencia. La idea de una frase:\n\n> **El negocio (dominio) no conoce el mundo exterior. El mundo exterior conoce al negocio.**\n\nEl dominio define **qué necesita** mediante interfaces (los **puertos**). El mundo exterior (base, RabbitMQ, MercadoPago) provee implementaciones de esas interfaces (los **adapters**). Las dependencias **apuntan siempre hacia adentro**, hacia el dominio.\n\n```mermaid\nflowchart LR\n    subgraph Exterior\n      IN[Adapters de ENTRADA<br/>RabbitListener, HTTP] \n      OUT[Adapters de SALIDA<br/>Repo JPA, cliente MercadoPago, RabbitTemplate]\n    end\n    subgraph application[application]\n      UC[Casos de uso]\n      PIN[/Puertos de entrada/]\n      POUT[/Puertos de salida/]\n    end\n    subgraph domain[domain]\n      D[Entidades + reglas<br/>de negocio puras]\n    end\n\n    IN --> PIN --> UC\n    UC --> POUT\n    POUT -.implementa.-> OUT\n    UC --> D\n```\n\n### Las tres capas\n\n- **`domain`** — el corazón. Entidades, reglas de negocio, invariantes. **Cero dependencias** de Spring, JPA o RabbitMQ. Es Java puro. Acá vive \"una orden no puede reembolsarse si no fue confirmada\", \"un pago expira a los X minutos\", etc.\n- **`application`** — los **casos de uso** (orquestan el dominio) y la **definición de los puertos** (interfaces). Un caso de uso dice \"para procesar una solicitud, valido con el dominio, persisto con el *puerto de repositorio*, y publico un evento con el *puerto de mensajería*\". No sabe **quién** implementa esos puertos.\n- **`adapters`** — el mundo real conectado a los puertos. Dos familias:\n  - **Adapters de entrada** (*driving*): empujan al sistema desde afuera. En GWP, principalmente los `@RabbitListener` (y los controllers HTTP en el gateway). Toman un mensaje/request y llaman a un caso de uso.\n  - **Adapters de salida** (*driven*): el sistema los usa para hablar con el mundo. El repositorio JPA, el cliente HTTP de MercadoPago, el publicador de RabbitMQ. Implementan los puertos de salida.\n\n### La regla de oro: dependencias hacia adentro\n\n`adapters` → `application` → `domain`. **Nunca al revés.** El `domain` no importa nada de `application`; `application` no importa nada de `adapters`. Por eso el negocio se testea sin levantar base ni broker: le pasás *mocks* de los puertos.\n\n> **Analogía:** el puerto de salida `PaymentRepository` (interface en `application`) es como un `interface DAO` que vos definís según lo que **el negocio necesita** (\"guardame esta orden\", \"traeme la orden por uuid\"). El adapter JPA lo implementa. El caso de uso depende de **tu interface**, no de `JpaRepository`. Cambiás de PostgreSQL a otra cosa tocando solo el adapter; el negocio ni se entera.\n\n### CQRS — separar lo que cambia de lo que pregunta\n\n**CQRS** = *Command Query Responsibility Segregation*. La idea: separar las operaciones que **cambian estado** (commands) de las que **leen estado** (queries), en vez de mezclar todo en un \"service\" que hace ambas. En un sistema event-driven aparece una tercera categoría natural: los **eventos**.\n\nDistinguilos así:\n\n| Tipo | Intención | Tiempo verbal | Ejemplo conceptual |\n|------|-----------|---------------|--------------------|\n| **Command** | \"hacé esto\" — una orden que *puede* fallar/rechazarse | imperativo | \"creá la orden en MercadoPago\" |\n| **Event** | \"esto ya pasó\" — un hecho, inmutable | pasado | `OnPaymentRequestReceivedEvent` |\n| **Query** | \"decime esto\" — sin efectos | pregunta | \"traeme el estado de la orden\" |\n\nDiferencia sutil pero importante: un **command** expresa *intención* y un destinatario puede rechazarlo; un **event** es un *hecho consumado* y a quien lo escucha solo le queda reaccionar. En GWP los **commands son inmutables (`record`)** — una vez creados no se tocan, lo que los hace seguros para pasar entre hilos y serializar.\n\n> **Por qué importa acá:** el api-gateway recibe un request, lo valida y emite un **evento** (`OnPaymentRequestReceivedEvent`). El payment-service consume ese evento y, para que MercadoPago cree la orden, emite lo que conceptualmente es un **command** hacia el adapter. Separar estas intenciones evita el clásico \"God Service\" que hace todo y no se entiende.\n\n### Y todo esto compilado a binario nativo (GraalVM)\n\nLos 4 servicios se compilan a **binario nativo con GraalVM** (*ahead-of-time*). Para vos, dos consecuencias prácticas: arranque casi instantáneo y bajo consumo de RAM (ideal para muchos pods chicos en K8s), pero **menos reflexión dinámica** disponible — por eso hexagonal/CQRS con tipos explícitos y `record` encaja tan bien, y por eso a veces ves *hints* de configuración nativa. Es un dato a tener presente, no algo que tengas que dominar esta semana.\n\n---\n\n## 🔍 En nuestro sistema\n\nLos **patrones transversales en los 4 servicios** son exactamente estos: Hexagonal, Clean Architecture (dependencias hacia adentro), CQRS, commands inmutables (`record`) y compilación nativa con GraalVM.\n\nCómo se nota servicio por servicio:\n\n- **payment-service** — el caso más rico. Su `domain` tiene las reglas de la orden de pago (estados, expiración, condiciones de reembolso). Sus **puertos de entrada** son los `@RabbitListener` que reciben eventos; sus **puertos de salida** son el repositorio PostgreSQL y el publicador de eventos. Es el *Aggregate Root*: el dueño de la verdad del estado del pago.\n- **mercadopago-adapter** — es, él mismo, un **adapter de salida del sistema** (encapsula MercadoPago), pero internamente también está organizado en capas: puerto de entrada (consume colas), dominio finito (traducir eventos GWP ↔ API MercadoPago), puerto de salida (el cliente HTTP real).\n- **notification-service** — puerto de entrada (consume 2 colas), y un puerto de salida que es el POST HTTP firmado al cliente. Sus **12 extractores de metadatos por proveedor** son un **patrón Strategy** (lo vemos en Etapa 4): una interfaz, muchas implementaciones, se elige la del proveedor en runtime.\n- **api-gateway** — más finito, pero igual separa: adapter de entrada (controllers HTTP) → caso de uso (validar + transformar a evento) → puerto de salida (publicar a RabbitMQ).\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- La **estructura de paquetes** de cada servicio: buscá carpetas/paquetes `domain`, `application`, `adapters` (o `infrastructure`/`adapter`). El árbol de paquetes te cuenta la arquitectura.\n- En `application`: las **interfaces de puertos** (suelen tener nombres tipo `...Port`, `...Repository`, `...Publisher`, `...UseCase`) y las clases de **casos de uso**.\n- En `adapters`: las **implementaciones** de esos puertos (el repo JPA, el cliente de MercadoPago, el publicador RabbitMQ, los `@RabbitListener`).\n- En `domain`: confirmá que esas clases **no importan** `org.springframework.*` ni `jakarta.persistence.*`. Si el dominio está limpio, la regla de dependencias se respeta.\n- Los **`record`** usados como commands/events.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. ¿Por qué el `domain` no debe importar nada de Spring, JPA ni RabbitMQ? ¿Qué ganás concretamente con esa restricción?\n2. ¿Qué es un **puerto de entrada** y qué es un **puerto de salida**? Dá un ejemplo de cada uno en el payment-service.\n3. Diferenciá **command**, **event** y **query**. ¿Por qué `OnPaymentRequestReceivedEvent` es un evento y no un command?\n4. ¿En qué dirección apuntan las dependencias entre `adapters`, `application` y `domain`, y por qué nunca al revés?\n5. ¿Por qué tiene sentido que los commands sean `record` inmutables en un sistema que los serializa y los pasa entre hilos/servicios?\n\n---\n\n## ✍️ Mini-ejercicio\n\nTomá el caso de uso conceptual \"procesar una solicitud de pago\" del payment-service. En una hoja, escribí los **3-4 pasos** que haría el caso de uso (validar con el dominio, persistir, publicar evento…). Al lado de cada paso, marcá si usa el **dominio**, un **puerto de salida** o emite un **evento**. Después, identificá: si mañana cambian PostgreSQL por otra base, **¿qué capa(s) tocás y cuál NO?** Justificá en una línea.\n\n---\n\n**Siguiente:** `etapa-4-recorrido-microservicios.md`\n","# Etapa 4 — Recorrido de los 4 microservicios\n\n## 🎯 Objetivo de la etapa\n\nTener una **ficha mental clara de cada microservicio**: qué hace, qué consume, qué publica, sus casos de uso y qué buscar en su código. Al terminar deberías poder dibujar el sistema completo de memoria.\n\n> Los **números de colas/exchanges** y los **nombres de exchanges/eventos** son los reales. Los nombres de **clases/archivos** los confirmás en el repo.\n\n---\n\n## 📖 Teoría (cómo leer una ficha de servicio)\n\nPara cada servicio mirá siempre cuatro cosas, en este orden:\n\n1. **Responsabilidad** — ¿de qué es dueño? ¿Tiene estado (BD) o es *stateless*?\n2. **Entradas** — ¿qué colas consume? (Eso te dice a qué hechos reacciona.)\n3. **Salidas** — ¿a qué exchanges publica? (Eso te dice qué hechos genera.)\n4. **Forma** — ¿tiene HTTP? ¿schedulers? ¿patrones especiales?\n\nUn servicio event-driven se entiende por **lo que escucha y lo que grita**, no por una API.\n\n---\n\n## 🔍 En nuestro sistema\n\n### 4.1 — api-gateway\n\n| | |\n|---|---|\n| **Responsabilidad** | Único punto de entrada HTTP. Valida, transforma requests en eventos, publica a RabbitMQ. |\n| **Estado** | *Stateless*, **sin BD**. |\n| **Servidor** | **Undertow**. |\n| **Forma** | Responde `202`/`200` sin bloquear. Productor puro de eventos. |\n\n**4 casos de uso (endpoint → evento → exchange):**\n\n| Endpoint | Evento / destino | Exchange | Tipo / routing key |\n|---|---|---|---|\n| `POST /api/v1/payments` | `OnPaymentRequestReceivedEvent` | `on_new_payment_request` | fanout, rk `\"\"` |\n| `POST /api/v1/webhooks/{provider}/notifications` | notificación de webhook | `on_new_webhook_notification` | topic, rk = `providerCode` |\n| `POST /api/v1/payments/{uuid}/cancel` | solicitud de cancelación | `on_new_cancel_order_request` | (entrada de cancelación) |\n| `POST /api/v1/payments/{uuid}/refund` | solicitud de reembolso | `on_new_refund_order_request` | (entrada de reembolso) |\n\n> **Idea:** el gateway es deliberadamente \"tonto\". No tiene reglas de negocio de pago; su trabajo es **traducir HTTP → evento** lo más rápido posible y soltar la conexión. Por eso usa Undertow (servidor liviano, eficiente con muchas conexiones concurrentes) y no necesita base.\n\n---\n\n### 4.2 — payment-service\n\n| | |\n|---|---|\n| **Responsabilidad** | **Orquestador central / Aggregate Root.** Dueño de la verdad del estado de cada pago. |\n| **Estado** | **PostgreSQL 16** (9 tablas) con **HikariCP**. |\n| **Forma** | 100% event-driven, **sin endpoints HTTP**. Consume **9 colas**, publica a **6 exchanges**. |\n| **Patrón clave** | **Transactional Outbox** (lo vemos a fondo en Etapa 5). |\n| **Schedulers** | `ExpiredOrdersScheduler` (cada 5s) y `RefundInProgressScheduler` (cada 60s). |\n\n**Transactional Outbox, en una frase:** cada evento que va a publicar se **persiste en la misma transacción** que la entidad de negocio. Se intenta publicar de una vía un `ApplicationEvent` de Spring; si esa publicación falla, un **scheduler de respaldo reintenta cada 3s (máx 3 intentos)**. Así nunca tenés \"guardé el estado pero perdí el evento\" (ni al revés). Casos idempotentes con **rollback automático**.\n\n**Los schedulers internos** son la pieza que rompe la idea de \"todo lo dispara un HTTP\":\n- `ExpiredOrdersScheduler` (5s): busca órdenes que vencieron sin pagarse y dispara su expiración. **Nadie hace un request para esto**: lo dispara el tiempo.\n- `RefundInProgressScheduler` (60s): revisa reembolsos en curso y los hace avanzar/consultar estado.\n\n> **Mentalidad:** este es el servicio donde más se nota el cambio respecto del monolito. No tiene puerta HTTP; **vive reaccionando a colas y a relojes internos**. Es el cerebro: decide, persiste y emite los próximos eventos.\n\n---\n\n### 4.3 — mercadopago-adapter\n\n| | |\n|---|---|\n| **Responsabilidad** | Adaptador de **salida** (hexagonal) hacia MercadoPago. Encapsula TODA la integración con su API REST. |\n| **Estado** | *Stateless*, **sin BD**. |\n| **Forma** | Consume **6 colas**, publica **5 exchanges**. |\n| **Integración** | `POST /v1/orders`, `GET /v1/orders/{id}`, `.../cancel`, `.../refund`. |\n| **Seguridad** | Valida webhooks con **firma HMAC-SHA256**. **Token y webhook secret por cliente**. |\n| **Resiliencia** | **Reintentos automáticos con DLQ**. Soporta **proxy HTTP corporativo**. |\n\n> **Idea:** todo lo \"sucio\" de hablar con un tercero (autenticación por cliente, formato de la API, validación de firmas, reintentos cuando MercadoPago tira error o timeout) queda **encapsulado acá**. El resto del sistema no sabe que MercadoPago existe: solo conoce eventos GWP. Si mañana entra otro proveedor, idealmente nace otro adapter hermano, sin tocar al payment-service.\n\nLa **firma HMAC-SHA256** es cómo el adapter verifica que un webhook **vino de verdad de MercadoPago** y no de un impostor: MercadoPago firma el cuerpo con un secreto compartido (el *webhook secret*, distinto por cliente), y el adapter recalcula la firma y la compara. Si no coincide, descarta.\n\n---\n\n### 4.4 — notification-service\n\n| | |\n|---|---|\n| **Responsabilidad** | Adaptador de **salida HTTP** hacia los clientes. Convierte eventos del payment-service en **HTTP POST firmados** a los webhooks de cada cliente. |\n| **Estado** | **Sin BD.** |\n| **Forma** | Consume **2 colas**, publica **1 exchange de auditoría** (`on_notification_attempt_completed`). |\n| **Firma** | **HMAC-SHA256** sobre el POST que manda al cliente. |\n| **Resiliencia** | **Backoff exponencial** (Spring Retry + Apache HttpClient 5), configurable por cliente. |\n| **Patrón clave** | **12 extractores de metadatos** inyectados por proveedor → **Strategy**. |\n\n**El patrón Strategy de los 12 extractores:** distintos proveedores meten la metadata del pago en lugares distintos del payload. En vez de un `if/else` gigante por proveedor, hay **una interfaz \"extractor de metadatos\" y 12 implementaciones**, una por proveedor. En runtime se elige la del proveedor correspondiente. Eso es Strategy puro: comportamiento intercambiable detrás de una interfaz común.\n\n> **Analogía:** es el mismo patrón que cuando inyectás `List<Validator>` y elegís el que aplica según el tipo. Acá es `List<MetadataExtractor>` (o un `Map<provider, extractor>`) y se selecciona por proveedor.\n\n**El backoff exponencial** es su forma de no rendirse al primer fallo ni martillar al cliente: si el webhook del cliente no responde, reintenta esperando cada vez más (1s, 2s, 4s, 8s…). Y cada intento — exitoso o no — se **audita** publicando a `on_notification_attempt_completed`.\n\n---\n\n### Vista integrada\n\n```mermaid\nflowchart TB\n    GW[api-gateway<br/>HTTP in, sin BD] -->|on_new_payment_request fanout| PS\n    GW -->|on_new_webhook_notification topic| MPA\n    GW -->|on_new_cancel_order_request| PS\n    GW -->|on_new_refund_order_request| PS\n\n    PS[payment-service<br/>9 colas, 6 exchanges<br/>PostgreSQL + Outbox<br/>2 schedulers] <-->|eventos de orden| MPA[mercadopago-adapter<br/>6 colas, 5 exchanges<br/>HMAC, DLQ]\n    MPA -->|REST| MP[(API MercadoPago)]\n    PS -->|eventos de notificación| NS[notification-service<br/>2 colas, 1 exchange<br/>Strategy x12, backoff]\n    NS -->|POST firmado| CLIENTE[(Webhook del cliente)]\n    NS -->|on_notification_attempt_completed| AUDIT[(Auditoría)]\n```\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- **api-gateway:** los **controllers** (4 endpoints) y, en cada uno, la línea donde **publica el evento** y devuelve `202`/`200`. Confirmá que no hay acceso a BD.\n- **payment-service:** contá los **`@RabbitListener`** (esperá ~9) y las publicaciones a exchanges (~6). Buscá la **tabla/entidad del Outbox** (algo tipo `outbox_events`) y los dos schedulers (`@Scheduled`, métodos cada 5s y 60s).\n- **mercadopago-adapter:** el **cliente HTTP** de MercadoPago (puerto de salida), la **validación HMAC** del webhook, y la config de **DLQ/reintentos**. Buscá dónde se resuelven **token y secret por cliente**.\n- **notification-service:** la **interfaz del extractor de metadatos** y sus **12 implementaciones** (Strategy), la config de **Spring Retry** (backoff), y dónde publica `on_notification_attempt_completed`.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. ¿Por qué el api-gateway no tiene base de datos y el payment-service sí? ¿Qué dice eso sobre la responsabilidad de cada uno?\n2. El payment-service no tiene endpoints HTTP. Entonces, ¿de qué dos formas \"le llegan cosas para hacer\"?\n3. ¿Qué encapsula el mercadopago-adapter que el resto del sistema **no** debería conocer? Dá dos ejemplos.\n4. Explicá el patrón Strategy de los 12 extractores: ¿qué problema evita frente a un `switch` por proveedor?\n5. ¿Para qué publica el notification-service a `on_notification_attempt_completed` si nadie \"necesita\" ese evento para el flujo principal?\n\n---\n\n## ✍️ Mini-ejercicio\n\nHacé **cuatro fichas** (una por servicio) en una tarjeta cada una, con solo 4 renglones: **(1)** ¿tiene BD?, **(2)** ¿tiene HTTP?, **(3)** ¿cuántas colas consume?, **(4)** ¿cuántos exchanges publica? Tapá el documento y completá de memoria. Después verificá. El objetivo es que el \"esqueleto\" del sistema te quede grabado antes de los flujos de la Etapa 6.\n\n---\n\n**Siguiente:** `etapa-5-patrones.md`\n","# Etapa 5 — Patrones que tenés que entender sí o sí\n\n## 🎯 Objetivo de la etapa\n\nDominar los patrones que hacen que un sistema event-driven sea **confiable** y no un caos de mensajes perdidos: **Transactional Outbox, idempotencia, consistencia eventual, entrega at-least-once, reintentos y backoff, DLQ y schedulers**. Para cada uno: qué problema resuelve y dónde aparece en GWP.\n\nEsta es **la etapa más importante del documento.** Si entendés esto, el código después se lee solo.\n\n---\n\n## 📖 Teoría\n\n### 5.1 — El problema raíz: el \"dual write\"\n\nImaginá el payment-service procesando un evento. Tiene que hacer **dos cosas**: (a) guardar el nuevo estado en PostgreSQL y (b) publicar un evento a RabbitMQ para que el flujo siga. Son **dos sistemas distintos**. Y acá está la trampa:\n\n```java\n// EL BUG CLÁSICO — no hagas esto\n@Transactional\npublic void handle(Event e) {\n    repo.save(order);                 // (a) commit en PostgreSQL\n    rabbitTemplate.send(nextEvent);   // (b) publish en RabbitMQ\n}\n```\n\n¿Qué pasa si la app se cae **entre (a) y (b)**? Guardaste el estado pero **nunca publicaste el evento**. El pago quedó \"confirmado\" en tu base pero el adapter nunca se enteró: flujo cortado, plata en el limbo. Y al revés es peor: si publicás primero y el commit de la base falla, mandaste un evento sobre algo que **no pasó**.\n\nNo podés meter PostgreSQL y RabbitMQ en una sola transacción atómica (sin transacciones distribuidas, que son caras y frágiles). Este es el problema del **dual write**, y la solución es el Outbox.\n\n### 5.2 — Transactional Outbox\n\nLa idea es elegante: **convertí el dual write en un single write.** En vez de escribir a dos sistemas, escribí a **uno solo** (PostgreSQL) y dejá que un proceso aparte se encargue de publicar.\n\nCómo funciona:\n\n1. En la **misma transacción** que guardás la entidad de negocio, insertás una fila en una tabla **`outbox_events`** con el evento a publicar (serializado). Una sola transacción, atómica: o se guardan **las dos cosas** o **ninguna**.\n2. Después de commitear, intentás **publicar de una** (en GWP, vía un `ApplicationEvent` de Spring que dispara la publicación a RabbitMQ tras el commit).\n3. Si esa publicación inmediata **falla** (RabbitMQ no responde, red caída), no pasa nada grave: el evento **ya está guardado en `outbox_events`**. Un **scheduler de respaldo reintenta cada 3 segundos (máx 3 intentos)** publicando los eventos pendientes de la tabla.\n4. Cuando se publica con éxito, se marca el evento como enviado (o se borra de la tabla).\n\n```mermaid\nflowchart TB\n    A[Caso de uso] -->|misma TX| B[(orders + outbox_events<br/>PostgreSQL)]\n    B -->|tras commit| C{Publish inmediato<br/>vía ApplicationEvent}\n    C -->|OK| MQ((RabbitMQ))\n    C -->|falla| D[Scheduler de respaldo<br/>cada 3s, máx 3 intentos]\n    D --> MQ\n```\n\n> **Por qué es genial:** transformaste \"guardar estado Y publicar evento, atómicamente\" (imposible entre dos sistemas) en \"guardar estado Y registrar la intención de publicar, atómicamente\" (trivial, es una sola base). La publicación real se vuelve un detalle reintentable que **nunca pierde el evento**.\n\n**En GWP:** lo implementa el **payment-service**. Tabla `outbox_events`, publish inmediato vía `ApplicationEvent` + scheduler de respaldo cada 3s (máx 3 intentos). Casos idempotentes con **rollback automático**.\n\n### 5.3 — Entrega at-least-once\n\nRecordá de la Etapa 1: el mensaje no se borra hasta el **ack**. Si el consumidor se cae después de procesar pero antes de ackear, el broker **redan** el mensaje. Conclusión inevitable:\n\n> En este tipo de sistemas, un mensaje puede entregarse **más de una vez**. No es un bug: es la garantía *at-least-once*. La alternativa (*at-most-once*) perdería mensajes, y en pagos eso es inaceptable.\n\nSumale que el Outbox también puede publicar dos veces (publicó, se cayó antes de marcarlo como enviado, el scheduler lo reintenta). Doble motivo para lo que sigue.\n\n### 5.4 — Idempotencia\n\n**Idempotente** = procesar el mismo mensaje N veces tiene el **mismo efecto** que procesarlo una vez. Es la **contramedida obligatoria** del at-least-once.\n\n> **Analogía:** `set saldo = 100` es idempotente (lo corras 1 o 5 veces, queda 100). `saldo = saldo + 100` **no lo es** (lo corrés 3 veces y sumaste 300). En pagos, \"confirmar la orden #123\" tiene que ser idempotente: si el evento de confirmación llega dos veces, la orden se confirma una sola vez, no cobrás dos veces.\n\nCómo se logra, en general:\n- Detectar duplicados por una **clave de negocio** (el `uuid` de la orden, un id de evento): \"¿ya procesé esto? entonces no hago nada\".\n- Diseñar las operaciones como **transiciones de estado idempotentes** (\"confirmar\" sobre algo ya confirmado = no-op).\n\n**En GWP:** el contexto menciona explícitamente **\"casos idempotentes con rollback automático\"** en el payment-service. Es decir: si un evento ya fue procesado (o si su procesamiento viola una invariante), se descarta/revierte sin duplicar efectos.\n\n### 5.5 — Consistencia eventual\n\nComo cada servicio tiene su propio estado y se comunican por eventos asíncronos, **el sistema no está perfectamente coherente en todo instante**. Hay una ventana — milisegundos a segundos — donde el payment-service ya confirmó el pago pero el notification-service todavía no avisó al cliente. Al rato, todo converge.\n\n> **El cambio de chip:** venís de transacciones ACID donde, al commitear, **todo** está coherente *ya*. Acá aceptás que la coherencia llega *después* (\"eventualmente\"). A cambio, ganás desacople y disponibilidad. La clave es que el sistema **converge** a un estado correcto, y mientras tanto nunca pierde información (gracias a colas + Outbox + reintentos).\n\n### 5.6 — Reintentos y backoff\n\nCuando un consumidor falla por algo **transitorio** (MercadoPago tuvo un timeout, el webhook del cliente devolvió 503), no querés rendirte ni martillar. **Reintentás**, idealmente con **backoff exponencial**: esperás cada vez más entre intentos (1s, 2s, 4s, 8s…), a veces con un poco de aleatoriedad (*jitter*) para no sincronizar reintentos.\n\n**En GWP:**\n- **mercadopago-adapter:** reintentos automáticos contra la API de MercadoPago, con **DLQ** cuando se agotan.\n- **notification-service:** **backoff exponencial** con Spring Retry + Apache HttpClient 5, **configurable por cliente** (cada cliente puede tolerar reintentos distintos).\n\n### 5.7 — DLQ como red de seguridad\n\nSi un mensaje falla y falla y falla (un *poison message*: payload corrupto, un bug que siempre explota), reintentarlo para siempre **bloquearía la cola** y quemaría recursos. La **DLQ** lo saca de circulación: lo deriva a una cola aparte para inspección humana. El flujo sano sigue; el problemático queda aislado y visible.\n\n> **Regla de oro operativa:** una DLQ que crece es una **alarma**. Significa \"hay mensajes que ningún reintento pudo procesar — vení a mirar\". En la Etapa 8 vemos cómo investigarla.\n\n### 5.8 — Schedulers (cuando el disparador es el tiempo)\n\nNo todo lo dispara un mensaje o un HTTP. Algunas cosas las dispara **el reloj**. En event-driven los schedulers cumplen dos roles típicos:\n\n1. **Respaldo de entrega:** el scheduler del Outbox (cada 3s) que publica lo que el publish inmediato no pudo.\n2. **Reglas de negocio temporales:** cosas que \"pasan solas\" con el tiempo.\n\n**En GWP**, el payment-service tiene:\n- `ExpiredOrdersScheduler` (**cada 5s**): expira órdenes QR que vencieron sin pagarse.\n- `RefundInProgressScheduler` (**cada 60s**): hace avanzar/consulta reembolsos en curso.\n\n> **Analogía:** es tu `@Scheduled` de toda la vida. La diferencia es el rol que cumple: acá el scheduler es a la vez **red de seguridad** del mensaje (Outbox) y **fuente de eventos** (la expiración no la pide nadie; la dispara el tiempo y genera un evento que recorre el sistema).\n\n---\n\n## 🔍 En nuestro sistema — tabla resumen\n\n| Patrón | Dónde vive en GWP | Qué problema resuelve |\n|---|---|---|\n| Transactional Outbox | payment-service (`outbox_events`, publish + scheduler 3s/máx 3) | dual write: no perder ni inventar eventos |\n| Idempotencia | payment-service (casos idempotentes + rollback) | duplicados por at-least-once |\n| At-least-once | todo el sistema (ack/nack de RabbitMQ) | no perder mensajes |\n| Consistencia eventual | todo el sistema | desacople sin transacción distribuida |\n| Reintentos + DLQ | mercadopago-adapter | fallas transitorias de MercadoPago |\n| Backoff exponencial | notification-service (Spring Retry, por cliente) | webhooks de cliente caídos/lentos |\n| Schedulers | payment-service (Outbox 3s, expiración 5s, refunds 60s) | respaldo de entrega + reglas temporales |\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- La **entidad/tabla del Outbox** (`outbox_events` o similar) y la clase que **inserta el evento en la misma transacción** que la entidad. Buscá el uso de un `ApplicationEvent` de Spring publicado **tras el commit** (mirá `@TransactionalEventListener` con `phase = AFTER_COMMIT`, o un `ApplicationEventPublisher`).\n- El **scheduler del Outbox** (un `@Scheduled` cada ~3s que recorre eventos pendientes) y la lógica de **máx 3 intentos**.\n- La **detección de idempotencia**: dónde se chequea \"¿ya procesé este evento/uuid?\" antes de aplicar efectos.\n- En el adapter, la config de **reintentos + DLQ** (argumentos `x-dead-letter-*`, política de retry).\n- En el notification-service, la config de **Spring Retry / backoff** (anotaciones `@Retryable`/`@Backoff` o config programática) y dónde se lee la política **por cliente**.\n- Los dos **`@Scheduled`** del payment-service (5s y 60s).\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. Explicá el problema del **dual write** con tus palabras. ¿Por qué un `@Transactional` que guarda en la base y publica a RabbitMQ **no** lo resuelve?\n2. ¿Cómo convierte el Outbox un \"dual write\" en un \"single write\"? ¿Qué rol cumple el scheduler de respaldo?\n3. ¿Por qué la entrega *at-least-once* **obliga** a que los consumidores sean idempotentes? Dá un ejemplo de operación idempotente y uno que no lo sea en un contexto de pagos.\n4. ¿Qué es la consistencia eventual y por qué es un costo aceptable acá? ¿En qué momento del flujo de pago se nota esa ventana?\n5. ¿Cuándo un mensaje termina en la DLQ y por qué una DLQ que crece es una señal de alarma?\n\n---\n\n## ✍️ Mini-ejercicio\n\nTrazá el Outbox a mano. Dibujá la línea de tiempo del payment-service procesando un evento, con estos hitos: **TX abre → save(order) → insert(outbox_events) → TX commit → publish inmediato → ¿OK?**. Ahora **rompé el sistema en 3 lugares distintos** (caída antes del commit, caída justo después del commit pero antes del publish, fallo del publish inmediato) y para cada caso escribí: **¿qué quedó en la base?** y **¿quién termina publicando el evento?**. La conclusión que buscás: en ningún caso se pierde el evento.\n\n---\n\n**Siguiente:** `etapa-6-flujos-end-to-end.md`\n","# Etapa 6 — Flujos end-to-end\n\n## 🎯 Objetivo de la etapa\n\nSeguir un mensaje **paso a paso, salto por salto, por los 4 servicios**, en los 5 flujos que existen en GWP. Al terminar deberías poder responder, para cualquier flujo: *¿qué evento se emite, a qué exchange, con qué routing key, a qué cola llega y qué caso de uso lo consume?*\n\n> **Nota de honestidad:** los **nombres de los 4 exchanges de entrada** (`on_new_payment_request`, `on_new_webhook_notification`, `on_new_cancel_order_request`, `on_new_refund_order_request`) y el de auditoría (`on_notification_attempt_completed`) son reales. Los **exchanges/colas intermedios** entre payment-service ↔ adapter ↔ notification **no están nombrados** en la doc de arquitectura, así que acá los describo por su **función** (ej. \"evento de orden creada\"), no con un nombre inventado. Confirmá los nombres exactos en la clase de configuración de RabbitMQ cuando tengas el repo.\n\n---\n\n## 📖 Cómo leer un flujo\n\nCada salto entre servicios tiene **siempre** la misma anatomía. Entrenate a identificarla:\n\n```\n[Servicio A] --emite--> EVENTO --a--> EXCHANGE (tipo, routing key) --binding--> COLA --consume--> [Servicio B / caso de uso]\n```\n\nSi para cada salto podés completar esos casilleros, entendiste el flujo. Vamos.\n\n---\n\n## 🔍 Flujo 1 — Solicitud de pago → generación de QR\n\nEl cliente quiere cobrar; el sistema genera una orden QR en MercadoPago y se la devuelve (asíncronamente) al cliente.\n\n**Paso a paso:**\n\n1. **Cliente → api-gateway:** `POST /api/v1/payments`. El gateway valida, arma `OnPaymentRequestReceivedEvent`, lo publica a **`on_new_payment_request`** (fanout, rk `\"\"`) y responde **`202`**.\n2. **api-gateway → payment-service:** el evento llega a la cola del payment-service. Su caso de uso \"procesar solicitud de pago\" valida con el dominio, **persiste la orden** (estado inicial) y, vía **Outbox**, emite un evento \"hay que crear la orden en el proveedor\".\n3. **payment-service → mercadopago-adapter:** el adapter consume ese evento, llama a **`POST /v1/orders`** de MercadoPago (con el token del cliente), recibe los datos del QR y **emite un evento \"orden creada en el proveedor\"** (con el QR/datos).\n4. **mercadopago-adapter → payment-service:** el payment-service consume la respuesta, **actualiza la orden** con el QR (misma mecánica Outbox) y emite un evento \"orden lista / QR disponible\".\n5. **payment-service → notification-service:** el notification-service consume ese evento, arma un **HTTP POST firmado (HMAC)** y lo manda al webhook del cliente con el QR. Publica el resultado a **`on_notification_attempt_completed`** (auditoría).\n\n```mermaid\nsequenceDiagram\n    participant C as Cliente\n    participant GW as api-gateway\n    participant PS as payment-service\n    participant MPA as mercadopago-adapter\n    participant MP as MercadoPago\n    participant NS as notification-service\n\n    C->>GW: POST /api/v1/payments\n    GW-->>C: 202 Accepted\n    GW->>PS: OnPaymentRequestReceivedEvent<br/>(exch on_new_payment_request, fanout)\n    Note over PS: valida + persiste orden<br/>(Outbox)\n    PS->>MPA: evento \"crear orden en proveedor\"\n    MPA->>MP: POST /v1/orders (token del cliente)\n    MP-->>MPA: datos del QR\n    MPA->>PS: evento \"orden creada\" (+ QR)\n    Note over PS: actualiza orden (Outbox)\n    PS->>NS: evento \"QR disponible\"\n    NS->>C: HTTP POST firmado (HMAC) con el QR\n    NS->>NS: publica on_notification_attempt_completed\n```\n\n> **Fijate** que el cliente recibió su `202` en el paso 1, muchísimo antes de que el QR estuviera listo. Cuando el QR está, se entera **por su webhook**. Eso es asincronía pura.\n\n---\n\n## 🔍 Flujo 2 — Confirmación de pago (webhook de MercadoPago, happy path)\n\nEl usuario final pagó el QR. MercadoPago avisa por webhook; el sistema confirma y notifica.\n\n**Paso a paso:**\n\n1. **MercadoPago → api-gateway:** `POST /api/v1/webhooks/{provider}/notifications`. El gateway publica a **`on_new_webhook_notification`** (topic, rk = `providerCode`) y responde rápido.\n2. **api-gateway → mercadopago-adapter:** la notificación rutea (por `providerCode`) a la cola del adapter. El adapter **valida la firma HMAC-SHA256** del webhook con el *secret* del cliente. Si es válida, normalmente **consulta el estado real** con `GET /v1/orders/{id}` (no confía solo en el aviso) y emite un evento \"pago confirmado\".\n3. **mercadopago-adapter → payment-service:** el payment-service consume \"pago confirmado\", **actualiza la orden a confirmada** de forma **idempotente** (si el webhook llega dos veces, confirma una sola), y emite un evento \"pago confirmado al cliente\".\n4. **payment-service → notification-service:** notifica al cliente con POST firmado y audita el intento.\n\n```mermaid\nsequenceDiagram\n    participant MP as MercadoPago\n    participant GW as api-gateway\n    participant MPA as mercadopago-adapter\n    participant PS as payment-service\n    participant NS as notification-service\n    participant C as Cliente\n\n    MP->>GW: POST /webhooks/{provider}/notifications\n    GW-->>MP: 200/202\n    GW->>MPA: on_new_webhook_notification<br/>(topic, rk=providerCode)\n    Note over MPA: valida firma HMAC-SHA256\n    MPA->>MP: GET /v1/orders/{id} (confirma estado)\n    MP-->>MPA: estado = pagado\n    MPA->>PS: evento \"pago confirmado\"\n    Note over PS: actualiza orden<br/>(IDEMPOTENTE)\n    PS->>NS: evento \"notificar confirmación\"\n    NS->>C: HTTP POST firmado (HMAC)\n    NS->>NS: on_notification_attempt_completed\n```\n\n> **El detalle de oro:** el paso 3 es idempotente *a propósito*. MercadoPago puede mandar el webhook más de una vez, y RabbitMQ puede redan el mensaje (at-least-once). El pago se confirma **una sola vez**.\n\n---\n\n## 🔍 Flujo 3 — Consulta de cambio de estado (disparada por scheduler)\n\nEste flujo **no empieza con un HTTP**. Lo dispara el **tiempo**. Es el ejemplo perfecto de \"fuente de eventos = reloj\".\n\n**Paso a paso:**\n\n1. **Scheduler (payment-service):** el `RefundInProgressScheduler` (cada 60s) o la lógica de polling de estado detecta órdenes que necesitan que se consulte su estado real en el proveedor, y emite un evento \"consultar estado de la orden\". (El `ExpiredOrdersScheduler`, cada 5s, es la variante que **expira** órdenes vencidas y emite \"orden expirada\".)\n2. **payment-service → mercadopago-adapter:** el adapter consume, hace **`GET /v1/orders/{id}`** y emite un evento con el estado actualizado.\n3. **mercadopago-adapter → payment-service:** el payment-service actualiza la orden (idempotente) y, si corresponde, emite un evento para **notificar el cambio al cliente**.\n4. **payment-service → notification-service:** notifica y audita.\n\n```mermaid\nsequenceDiagram\n    participant SCH as Scheduler (payment-service)\n    participant PS as payment-service\n    participant MPA as mercadopago-adapter\n    participant MP as MercadoPago\n    participant NS as notification-service\n\n    SCH->>PS: tick (cada 5s / 60s)\n    Note over PS: detecta órdenes a revisar / expirar\n    PS->>MPA: evento \"consultar estado\"\n    MPA->>MP: GET /v1/orders/{id}\n    MP-->>MPA: estado actual\n    MPA->>PS: evento \"estado actualizado\"\n    Note over PS: actualiza orden (idempotente)\n    PS->>NS: evento \"notificar cambio\" (si corresponde)\n    NS->>NS: on_notification_attempt_completed\n```\n\n> **Lo nuevo para vos:** acá no hay request del cliente. El sistema \"se mueve solo\". En un monolito esto sería un `@Scheduled` que llama un service; acá el scheduler **emite un evento** y deja que el flujo event-driven haga el resto.\n\n---\n\n## 🔍 Flujo 4 — Reembolso de pago\n\nEl cliente pide devolver un pago ya confirmado.\n\n**Paso a paso:**\n\n1. **Cliente → api-gateway:** `POST /api/v1/payments/{uuid}/cancel`… no — reembolso es `POST /api/v1/payments/{uuid}/refund`. El gateway publica a **`on_new_refund_order_request`** y responde rápido.\n2. **api-gateway → payment-service:** consume la solicitud, valida con el dominio que **la orden sea reembolsable** (regla de negocio: tiene que estar confirmada, etc.), marca la orden \"reembolso en progreso\" y emite un evento \"ejecutar reembolso en proveedor\".\n3. **payment-service → mercadopago-adapter:** el adapter llama a **`.../refund`** de MercadoPago y emite el resultado.\n4. **mercadopago-adapter → payment-service:** actualiza el estado del reembolso. Acá entra el **`RefundInProgressScheduler` (60s)**: si el reembolso queda \"en progreso\" (MercadoPago a veces los procesa async), el scheduler lo hace avanzar consultando estado hasta cerrarlo.\n5. **payment-service → notification-service:** notifica el reembolso al cliente y audita.\n\n```mermaid\nsequenceDiagram\n    participant C as Cliente\n    participant GW as api-gateway\n    participant PS as payment-service\n    participant MPA as mercadopago-adapter\n    participant MP as MercadoPago\n    participant SCH as RefundInProgressScheduler\n\n    C->>GW: POST /api/v1/payments/{uuid}/refund\n    GW-->>C: 202\n    GW->>PS: on_new_refund_order_request\n    Note over PS: valida reembolsable<br/>marca \"refund en progreso\"\n    PS->>MPA: evento \"ejecutar refund\"\n    MPA->>MP: POST .../refund\n    MP-->>MPA: resultado (puede ser async)\n    MPA->>PS: evento \"estado refund\"\n    loop cada 60s si sigue en progreso\n        SCH->>MPA: evento \"consultar refund\"\n        MPA->>MP: GET .../{id}\n        MP-->>MPA: estado\n        MPA->>PS: evento \"estado refund\"\n    end\n    Note over PS: cierra refund (idempotente)\n```\n\n---\n\n## 🔍 Flujo 5 — Cancelación de orden\n\nEl cliente cancela una orden **antes** de que se pague (típicamente, una orden QR todavía pendiente).\n\n**Paso a paso:**\n\n1. **Cliente → api-gateway:** `POST /api/v1/payments/{uuid}/cancel`. Publica a **`on_new_cancel_order_request`** y responde rápido.\n2. **api-gateway → payment-service:** valida que la orden **sea cancelable** (no pagada aún), marca \"cancelando\" y emite \"cancelar orden en proveedor\".\n3. **payment-service → mercadopago-adapter:** llama a **`.../cancel`** de MercadoPago y emite el resultado.\n4. **mercadopago-adapter → payment-service:** actualiza la orden a \"cancelada\" (idempotente) y emite \"notificar cancelación\".\n5. **payment-service → notification-service:** notifica y audita.\n\n```mermaid\nsequenceDiagram\n    participant C as Cliente\n    participant GW as api-gateway\n    participant PS as payment-service\n    participant MPA as mercadopago-adapter\n    participant MP as MercadoPago\n    participant NS as notification-service\n\n    C->>GW: POST /api/v1/payments/{uuid}/cancel\n    GW-->>C: 202\n    GW->>PS: on_new_cancel_order_request\n    Note over PS: valida cancelable, marca \"cancelando\"\n    PS->>MPA: evento \"cancelar orden\"\n    MPA->>MP: POST .../cancel\n    MP-->>MPA: cancelada\n    MPA->>PS: evento \"orden cancelada\"\n    Note over PS: actualiza estado (idempotente)\n    PS->>NS: evento \"notificar cancelación\"\n    NS->>C: HTTP POST firmado\n    NS->>NS: on_notification_attempt_completed\n```\n\n> **Relación con el Flujo 3:** una orden que **nadie cancela ni paga** termina expirando sola gracias al `ExpiredOrdersScheduler` (5s). Cancelación = el cliente lo pide; expiración = lo dispara el reloj. Mismo destino (orden cerrada), distinto disparador.\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- Para cada flujo, arrancá por el **caso de uso de entrada en el payment-service** (el `@RabbitListener` que consume el primer evento) y seguí **qué evento publica** al final. Eso te da el \"siguiente salto\".\n- Cruzá cada **publicación** con el **binding** correspondiente en la config de RabbitMQ para confirmar exchange + routing key + cola destino.\n- En el adapter, ubicá las 4 llamadas REST (`POST /v1/orders`, `GET /v1/orders/{id}`, `.../cancel`, `.../refund`) y qué evento dispara cada respuesta.\n- Confirmá los **nombres reales** de los exchanges/colas intermedios que acá describí por función.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. En el Flujo 1, ¿en qué momento exacto el cliente recibe respuesta del gateway, y cómo se entera después de que el QR está listo?\n2. En el Flujo 2, ¿por qué el adapter hace `GET /v1/orders/{id}` en vez de confiar directamente en el contenido del webhook?\n3. El Flujo 3 no tiene un actor \"Cliente\" al inicio. ¿Quién lo dispara y qué lo hace distinto de los demás?\n4. En el Flujo 4, ¿qué rol cumple el `RefundInProgressScheduler` y por qué hace falta un loop de consulta?\n5. Para **cualquier** salto entre dos servicios, ¿cuáles son los 5 casilleros que tenés que poder completar?\n\n---\n\n## ✍️ Mini-ejercicio\n\nElegí el **Flujo 2** (confirmación de pago). En una hoja, listá **cada cola que el mensaje atraviesa** desde que MercadoPago manda el webhook hasta que el cliente recibe la notificación, y **contá cuántas son**. Para cada cola, anotá qué servicio la consume. Después marcá **los dos puntos del flujo donde la idempotencia es indispensable** y explicá en una línea qué saldría mal sin ella.\n\n---\n\n**Siguiente:** `etapa-7-infraestructura.md`\n","# Etapa 7 — Infraestructura y \"verlo correr\"\n\n## 🎯 Objetivo de la etapa\n\nEntender **dónde y cómo corre** GWP: contenedores, Kubernetes/Minikube, el namespace `dev`, y las piezas (pods, deployments, services, configmaps, secrets). Y, sobre todo, tener una **guía concreta** para levantarlo localmente, mandar una solicitud de prueba y **ver los mensajes pasando por RabbitMQ**.\n\n> Esta etapa es la más \"manos\" del documento. Cuando tengas acceso al cluster, volvé acá con la compu al lado.\n\n> 📎 **Si Docker/Kubernetes te suenan nuevos:** esta etapa te enseña a **operar** el sistema (mirar pods, abrir la UI, ver logs). Para entender la **maquinaria por dentro** — imagen vs contenedor, cómo un Service encuentra a sus pods (labels/selectors), DNS interno, ConfigMap/Secret, PV/PVC, la jerarquía Deployment→ReplicaSet→Pod y los gotchas de Minikube — leé el **Apéndice A — Fundamentos de Docker y Kubernetes**. Esta etapa asume esos conceptos; el apéndice los construye desde cero.\n\n---\n\n## 📖 Teoría\n\n### Contenedores, rapidísimo\n\nVenís de desplegar `.jar`/`.war` en un servidor con un Tomcat instalado. Un **contenedor** empaqueta tu app **+ todo lo que necesita** (runtime, libs, config) en una unidad que corre igual en cualquier lado. En GWP, además, los servicios se compilan a **binario nativo con GraalVM**, así que el contenedor lleva un ejecutable que arranca en milisegundos y consume poca RAM — ideal para correr varios pods chicos.\n\n> **Analogía:** si el `.jar` era \"te paso el plato y vos poné la mesa (JVM, config, etc.)\", el contenedor es \"te paso la vianda lista, abrila y comé\". Misma vianda en tu máquina, en CI y en el cluster.\n\n### Kubernetes en 6 sustantivos\n\nKubernetes (K8s) **orquesta** contenedores: decide en qué máquina corre cada uno, los reinicia si se caen, los conecta entre sí. GWP corre sobre **Minikube** (un K8s de **1 nodo** para desarrollo local). Los conceptos que vas a tocar:\n\n| Concepto | Qué es | Analogía |\n|---|---|---|\n| **Pod** | la unidad que corre tu contenedor (1 o más) | un proceso corriendo |\n| **Deployment** | declara \"quiero N réplicas de este pod\" y las mantiene | un supervisor que reinicia procesos caídos |\n| **Service** | un nombre/IP estable para llegar a los pods (que van y vienen) | un DNS interno / balanceador |\n| **ConfigMap** | configuración no secreta (URLs, flags) inyectada al pod | un `application.yml` externo |\n| **Secret** | configuración sensible (tokens, secrets de webhook, password de PG) | una bóveda de credenciales |\n| **Namespace** | una \"carpeta\" lógica que aísla recursos | un environment (`dev`) |\n\n**En GWP:** todo vive en el namespace **`dev`** — por eso **todos los comandos llevan `-n dev`**. Cada microservicio es un **Deployment con 1 réplica**. RabbitMQ y PostgreSQL no son deployments comunes sino **StatefulSets** (`rabbitmq-0`, `postgres-0`), porque tienen **estado/identidad estable** (un StatefulSet le da a cada pod un nombre fijo y almacenamiento persistente — clave para una base o un broker).\n\n### Tipos de Service que vas a ver\n\n- **NodePort** — expone un puerto del nodo hacia afuera. El **api-gateway** se expone así: `api-gateway-nodeport :30000` → `:8080` del pod.\n- **ClusterIP** — solo accesible *dentro* del cluster (la mayoría de los servicios internos).\n- **Headless** — sin IP propia; se usa con StatefulSets para resolver cada pod por nombre (`rabbitmq-0`, `postgres-0`).\n\n### Cómo entra el tráfico\n\n```mermaid\nflowchart LR\n    Internet[Cliente / sala de juego] --> NGINX[Nginx<br/>reverse proxy externo]\n    NGINX --> NP[\"api-gateway-nodeport<br/>:30000\"]\n    NP --> GWPOD[\"api-gateway pod :8080\"]\n    GWPOD --> MQ[\"rabbitmq-service<br/>(ClusterIP/Headless)\"]\n    MQ --- RMQ[\"rabbitmq-0<br/>(StatefulSet)\"]\n    GWPOD -. resto del flujo .-> PS[payment-service]\n    PS --> PG[\"postgres-service\"]\n    PG --- PGPOD[\"postgres-0<br/>(StatefulSet)\"]\n```\n\n**Nginx** es el reverse proxy externo: recibe el tráfico de afuera y lo manda al NodePort del gateway (`:30000`), que

 adentro llega al `:8080` del pod. De ahí en más, todo es RabbitMQ.\n\n### Las dos piezas con estado\n\n- **RabbitMQ** — el broker. AMQP en **`5672`** (por donde hablan los servicios) y **UI Management en `15672`** (por donde mirás vos). StatefulSet `rabbitmq-0`.\n- **PostgreSQL 16** — base `payment_db` en **`:5432`**, usada **solo** por el payment-service. StatefulSet `postgres-0`.\n\n---\n\n## 🔍 En nuestro sistema — guía práctica\n\n### 1. Ver qué está corriendo\n\n```bash\nkubectl get pods -n dev      # ¿están todos los pods Running?\nkubectl get svc -n dev       # los services y sus puertos/tipos\n```\n\nEsperás ver, como mínimo: los 4 microservicios, `rabbitmq-0` y `postgres-0`. Si alguno está en `CrashLoopBackOff` o `Pending`, ahí empieza el troubleshooting (Etapa 8).\n\n### 2. Abrir la UI de RabbitMQ (tu ventana al sistema)\n\n```bash\nkubectl port-forward -n dev svc/rabbitmq-service 15672:15672\n# abrí http://localhost:15672  (user/pass suelen estar en un Secret/ConfigMap)\n```\n\nEn la UI:\n- **Exchanges:** confirmá tipos (fanout/topic/direct) y bindings.\n- **Queues:** mirá la **profundidad** de cada cola (mensajes encolados). Esto es lo que más vas a usar: una cola que crece = consumidor lento o caído.\n- Buscá la **DLQ**: si tiene mensajes, algo falló más de la cuenta.\n\n### 3. Mandar una solicitud de prueba y observar\n\nIdea del experimento (la secuencia exacta de comandos la ajustás con el repo):\n\n1. Dejá abierta la UI de RabbitMQ en la vista de **Queues**.\n2. Si el gateway no es accesible directo, exponelo: `kubectl port-forward -n dev svc/api-gateway-... 8080:8080` (o usá el NodePort `:30000` vía Minikube).\n3. Mandá un `POST /api/v1/payments` (con `curl`/Postman) con un body de prueba.\n4. **Mirá la magia:** verás un pico de tráfico en la cola del payment-service, después en la del adapter, después la del notification-service. El mensaje **viaja**. Eso que en la Etapa 6 dibujaste como `sequenceDiagram`, acá lo ves moverse en vivo.\n\n### 4. Mirar logs\n\n```bash\nkubectl logs -n dev <pod-del-payment-service> -f      # -f = seguir en vivo\nkubectl logs -n dev <pod-del-adapter> -f\n```\n\nSeguir los logs de los 4 servicios en paralelo mientras mandás un pago es **la mejor forma de ver el flujo event-driven con tus ojos**: ves cada servicio \"despertarse\" cuando le llega su evento.\n\n### 5. Panorama visual (opcional)\n\n```bash\nminikube dashboard    # UI web con pods, deployments, services, etc.\n```\n\n### Comandos de bolsillo\n\n```bash\nkubectl get pods -n dev\nkubectl get svc -n dev\nkubectl describe pod -n dev <pod>          # eventos/errores de arranque\nkubectl logs -n dev <pod> -f\nkubectl port-forward -n dev svc/rabbitmq-service 15672:15672\nminikube dashboard\n```\n\n---\n\n## 📂 Qué buscar en el código / repo (para la semana)\n\n- Los **manifiestos de Kubernetes** (carpeta tipo `k8s/`, `deploy/`, `manifests/`, o `.yaml` con `kind: Deployment`/`Service`/`StatefulSet`/`ConfigMap`/`Secret`). Ahí confirmás puertos, réplicas y nombres reales de services.\n- El **ConfigMap** y el **Secret**: qué configuración recibe cada servicio (URL de RabbitMQ, datos de PostgreSQL, tokens y webhook secrets por cliente).\n- El o los **Dockerfile** (probablemente *multi-stage* con build nativo GraalVM): confirma la compilación a binario nativo.\n- La config de **Nginx** (reverse proxy) si está versionada.\n- **Confirmá la versión de Java/Spring Boot** en el archivo de build (`pom.xml` → `<java.version>`, o `build.gradle`). Recordá: la doc dice **Java 21 / Spring Boot 3.5**, vos sospechabas Java 23 — este es el lugar donde lo verificás.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. ¿Por qué RabbitMQ y PostgreSQL son **StatefulSets** (`rabbitmq-0`, `postgres-0`) y no Deployments comunes como los microservicios?\n2. ¿Cuál es la diferencia entre un Service **NodePort** y uno **ClusterIP**, y por qué el api-gateway usa NodePort?\n3. ¿Para qué sirve `kubectl port-forward -n dev svc/rabbitmq-service 15672:15672` y qué vas a hacer una vez conectado?\n4. Si entrás a la UI de Management y la cola del payment-service crece sin parar mientras la del adapter está en 0, ¿qué sospechás y qué comando correrías para confirmar?\n5. ¿Dónde viven los **tokens y webhook secrets por cliente** en este esquema de infraestructura, y por qué no en un ConfigMap?\n\n---\n\n## ✍️ Mini-ejercicio\n\nEscribí en una hoja la **secuencia exacta de comandos** que correrías, en orden, para: (1) confirmar que todos los pods están arriba, (2) abrir la UI de RabbitMQ, (3) mandar un pago de prueba, y (4) seguir los logs del payment-service mientras lo hacés. No los ejecutes todavía (no tenés acceso aún): el objetivo es que el \"runbook\" te quede listo para el día que entres al cluster.\n\n---\n\n**Siguiente:** `etapa-8-consolidar.md`\n","# Etapa 8 — Consolidar\n\n## 🎯 Objetivo de la etapa\n\nCerrar el círculo. Usar todo lo aprendido en un **ejercicio mental de diseño** (\"cómo agregaría un proveedor nuevo\"), tener a mano un **mapa de troubleshooting** para los problemas típicos de un sistema event-driven, y un **glosario de una página** para repasar de un vistazo.\n\n---\n\n## 📖 Ejercicio de cierre: \"¿Cómo agregaría un proveedor nuevo?\"\n\nEsta es **la** pregunta que demuestra si entendiste la arquitectura. Hoy GWP habla con MercadoPago. Imaginá que entra un proveedor nuevo — digamos \"PagoYa\". ¿Qué tocás?\n\nPensalo vos primero, en una hoja, antes de leer lo de abajo. Recorré los 4 servicios y preguntate \"¿este se entera de que existe PagoYa?\".\n\n### La respuesta (y por qué la arquitectura te ayuda)\n\n**1. api-gateway — casi sin cambios.** El endpoint de webhooks ya es genérico: `POST /api/v1/webhooks/{provider}/notifications`. El `{provider}` se vuelve la **routing key** (`providerCode`) en el exchange `on_new_webhook_notification` (topic). Para que las notificaciones de PagoYa ruteen a su adapter, alcanza con **agregar un binding** con la routing key de PagoYa. **No tocás el código del gateway.** ← *Acá ves por qué el exchange de webhook es `topic` y no `fanout`.*\n\n**2. Un nuevo `pagoya-adapter` — el grueso del trabajo.** Nace un adapter hermano del `mercadopago-adapter`: consume las colas de PagoYa, traduce eventos GWP ↔ API de PagoYa, valida sus webhooks con **su** esquema de firma, maneja **sus** tokens/secrets por cliente, y sus reintentos/DLQ. Como el adapter **encapsula** todo lo del proveedor, el resto del sistema ni se entera del cambio.\n\n**3. payment-service — poco o nada.** Es el *Aggregate Root* y razona en **eventos de dominio genéricos** (\"orden creada\", \"pago confirmado\"), no en MercadoPago. Mientras el `pagoya-adapter` emita/consuma los mismos eventos de dominio, el payment-service sigue igual. *(Acá ves el valor de hexagonal: el negocio no conoce al proveedor.)*\n\n**4. notification-service — una Strategy nueva.** Recordá los **12 extractores de metadatos** (patrón Strategy). Si PagoYa mete la metadata distinto, agregás **una implementación más** del extractor para PagoYa. No tocás las otras 12. *(Acá ves el valor de Strategy.)*\n\n> **La moraleja:** una arquitectura event-driven + hexagonal + Strategy hace que \"agregar un proveedor\" sea **sumar piezas**, no **editar el corazón**. Si tu respuesta hubiera sido \"toco el payment-service para meter un `if (provider == pagoya)`\", la arquitectura estaría mal — y justamente está diseñada para que no haga falta.\n\n---\n\n## 🔧 Troubleshooting típico\n\nTres síntomas clásicos de sistemas event-driven y cómo encararlos. **Regla general: el estado del sistema se lee en RabbitMQ (colas/DLQ) y en los logs de los pods.**\n\n### Síntoma 1 — \"Hay mensajes en la DLQ\"\n\n**Qué significa:** uno o más mensajes fallaron lo suficiente como para ser desviados (poison message, payload inesperado, bug que siempre explota, o un dependiente caído mucho tiempo).\n\n**Cómo investigar:**\n1. En la UI de Management → la **DLQ** → mirá un mensaje (payload + headers; suele venir el motivo del descarte en los headers `x-death`).\n2. Cruzá con los **logs del consumidor** que la alimenta (`kubectl logs -n dev <pod> -f`) en la ventana de tiempo del fallo.\n3. Decidí: ¿es un bug (fix + reproceso) o un dato inválido (descartar)? Reprocesar suele ser re-publicar el mensaje a la cola original una vez corregida la causa.\n\n### Síntoma 2 — \"Una cola crece y no baja\" (consumidor caído/lento)\n\n**Qué significa:** los mensajes entran pero no se consumen al mismo ritmo.\n\n**Cómo investigar:**\n1. UI de Management → **Queues** → mirá *messages ready* (encolados) vs *unacked* (en vuelo) y las tasas.\n2. `kubectl get pods -n dev` → ¿el consumidor está `Running`? ¿`CrashLoopBackOff`?\n3. `kubectl logs -n dev <pod>` → ¿está lanzando excepciones (nack en loop)? ¿está lento (esperando a un tercero)?\n4. ¿`unacked` alto y estable? El consumidor tomó mensajes pero no ackea: está colgado procesando. ¿`ready` alto y `unacked` 0? No hay consumidor vivo.\n\n### Síntoma 3 — \"Un evento no llega / el flujo se cortó\"\n\n**Qué significa:** publicaste (o creés que publicaste) pero el siguiente servicio no reacciona.\n\n**Cómo investigar (seguí el camino del mensaje):**\n1. ¿El productor **publicó**? Mirá sus logs y, si aplica, la tabla **`outbox_events`**: ¿quedó un evento sin marcar como enviado? (entonces el problema es la publicación, no el consumo). El scheduler de respaldo (3s/máx 3) debería reintentar.\n2. ¿El exchange tiene el **binding** correcto a la cola? Un binding mal armado (routing key equivocada en un topic) hace que el mensaje se publique **y se pierda** sin llegar a ninguna cola. Verificá en la UI → Exchanges → Bindings.\n3. ¿La cola destino existe y tiene consumidor? (Síntoma 2.)\n4. ¿Quedó en la **DLQ**? (Síntoma 1.)\n\n> **El reflejo correcto:** ante cualquier problema, recorré el camino que dibujaste en la Etapa 6 — productor → exchange → binding → cola → consumidor — y en cada salto preguntá \"¿llegó hasta acá?\". El primer salto donde la respuesta es \"no\" es tu problema.\n\n---\n\n## 📖 Glosario de una página (para imprimir y pegar al lado del monitor)\n\n| Término | En una línea |\n|---|---|\n| **Evento** | Hecho de negocio que ya pasó; inmutable, en pasado (`OnPaymentRequestReceivedEvent`). |\n| **Command** | Orden de \"hacé esto\"; puede rechazarse. En GWP, `record` inmutable. |\n| **Query** | Pregunta sin efectos; lee estado. |\n| **Mensaje** | El \"sobre\" (JSON + metadatos) que transporta un evento por el broker. |\n| **Exchange** | La central de correo: recibe del productor y rutea a colas. |\n| **Queue (cola)** | Casillero durable donde el mensaje espera al consumidor. |\n| **Binding** | Regla que conecta exchange ↔ cola (con o sin patrón de routing key). |\n| **Routing key** | Etiqueta del mensaje que el exchange usa para rutear (en webhook = `providerCode`). |\n| **fanout** | Exchange que copia a TODAS las colas atadas; ignora routing key. |\n| **topic** | Exchange que rutea por patrón de routing key (`*`, `#`). |\n| **direct** | Exchange que rutea por routing key exacta. |\n| **Productor / Consumidor** | Quien publica / quien lee mensajes. |\n| **ack / nack** | \"Procesado OK, borralo\" / \"falló, re-encolá o mandá a DLQ\". |\n| **Prefetch** | Cuántos mensajes sin-ack tiene un consumidor en vuelo a la vez. |\n| **DLQ** | Cola de descarte para mensajes que fallan repetidamente; red de seguridad. |\n| **at-least-once** | Garantía: el mensaje llega ≥1 vez (puede duplicarse). |\n| **Idempotencia** | Procesar N veces = mismo efecto que 1 vez. Contramedida del at-least-once. |\n| **Consistencia eventual** | El sistema converge a un estado coherente *al rato*, no al instante. |\n| **Transactional Outbox** | Persistir el evento en la misma TX que la entidad; publicar después (con reintento). |\n| **Dual write** | El problema de escribir a base + broker sin atomicidad; lo resuelve el Outbox. |\n| **Backoff exponencial** | Reintentar esperando cada vez más (1s, 2s, 4s…). |\n| **Hexagonal (Ports & Adapters)** | El dominio define puertos; el mundo exterior los implementa. Dependencias hacia adentro. |\n| **Puerto / Adapter** | Interface que el negocio necesita / implementación concreta (JPA, HTTP, RabbitMQ). |\n| **CQRS** | Separar comandos (escriben) de queries (leen). |\n| **Aggregate Root** | Dueño de la consistencia de un agregado; en GWP, el payment-service. |\n| **Strategy** | Una interfaz, muchas implementaciones intercambiables (los 12 extractores). |\n| **StatefulSet** | Recurso K8s para pods con identidad/almacenamiento estable (`rabbitmq-0`, `postgres-0`). |\n| **NodePort / ClusterIP / Headless** | Service expuesto al nodo / interno al cluster / sin IP (para StatefulSet). |\n| **ConfigMap / Secret** | Config no sensible / sensible inyectada a los pods. |\n\n---\n\n## 📂 Qué buscar en el código (para la semana)\n\n- Para validar el ejercicio del proveedor nuevo: compará la **estructura del `mercadopago-adapter`** con cómo se conectan los **eventos de dominio** en el payment-service. Confirmá que el payment-service **no menciona \"mercadopago\"** en su lógica de negocio.\n- Ubicá la **interfaz del extractor de metadatos** y contá sus implementaciones (deberían ser 12). Ese es el punto de extensión por proveedor en el notification-service.\n- Revisá la config de **DLQ** y de **`outbox_events`** otra vez, ahora con la mira puesta en *cómo investigarías* un problema real.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. Para agregar el proveedor \"PagoYa\", ¿qué tocás en cada uno de los 4 servicios? ¿Cuál es el que más cambia y cuál casi no cambia, y por qué?\n2. ¿Por qué el exchange de webhooks **tiene que ser `topic`** (y no `fanout`) para que el ejercicio del proveedor nuevo funcione limpio?\n3. Ves mensajes en la DLQ. Enumerá los pasos para investigar la causa.\n4. Una cola tiene `ready` alto y `unacked` en 0. ¿Qué está pasando? ¿Y si fuera `unacked` alto y estable?\n5. Un evento \"no llega\" al siguiente servicio. ¿Cuál es el camino que recorrés salto por salto para encontrar dónde se cortó?\n\n---\n\n## ✍️ Mini-ejercicio (cierre del curso)\n\nSin mirar el documento, dibujá el **sistema completo** en una hoja: los 4 servicios, RabbitMQ en el medio, PostgreSQL colgando del payment-service, MercadoPago a la derecha del adapter, y el cliente arriba. Dibujá las flechas de **un** flujo completo a elección (el que más te costó) con sus exchanges y colas. Después abrí la Etapa 6 y **corregite**. Lo que te falte o equivoques es exactamente lo que conviene repasar primero cuando entres al código.\n\n---\n\n**Fin de las etapas.** Las respuestas a todas las preguntas de verificación están en `99-respuestas.md`.\n","# Apéndice A — Fundamentos de Docker y Kubernetes desde cero\n\n## 🎯 Objetivo del apéndice\n\nQue entiendas **la maquinaria** que la Etapa 7 usaba sin abrir del todo. La Etapa 7 te enseñó a **operar** (mirar pods, abrir la UI, ver logs); este apéndice te enseña a **entender** cada pieza por dentro, partiendo de tu mundo de `.jar` en un Tomcat. Si la Etapa 7 era el manual del piloto, esto es el curso de cómo vuela el avión.\n\n> Todo lo de acá es **conceptual y genérico** (no depende del repo de GWP). Los `.yaml` son **ilustrativos**: el real puede variar en nombres y detalles, que confirmás en los manifiestos del proyecto.\n\n---\n\n## 📖 Teoría\n\n### A.1 — Imagen, contenedor y registry (la base de todo)\n\nEsta distinción es la que más confunde al principio, y sin ella nada cierra. Tres conceptos:\n\n- **Imagen** — la *plantilla* inmutable: un paquete de solo-lectura con tu app + todo lo que necesita (binario/runtime, libs, config base). No corre; es como un molde.\n- **Contenedor** — una *instancia en ejecución* de una imagen. De una imagen podés levantar 1, 5 o 50 contenedores idénticos. Es como pasar de la `class` al `new` que la instancia.\n- **Registry** — el *repositorio* de imágenes (Docker Hub, un registry privado de la empresa). Hacés `push` para subir una imagen y los nodos hacen `pull` para bajarla antes de correrla.\n\n> **Analogía directa con tu mundo:** la **imagen** es el `.jar` empaquetado *junto con la JVM y el SO mínimo* (no solo tu código, sino el plato servido entero). El **contenedor** es ese `.jar` **ejecutándose** (`java -jar ...` corriendo). El **registry** es como tu **Nexus/Artifactory**, pero de imágenes en vez de `.jar`.\n\n**El Dockerfile y las capas.** Una imagen se construye con un `Dockerfile`: una receta paso a paso. Cada instrucción genera una **capa** cacheada, así que reconstruir es rápido si solo cambió lo de arriba.\n\n```dockerfile\n# Ejemplo ILUSTRATIVO — multi-stage con build nativo GraalVM\n# Etapa 1: compilar a binario nativo (imagen pesada, con todo el toolchain)\nFROM ghcr.io/graalvm/native-image AS build\nCOPY . /app\nRUN cd /app && ./mvnw -Pnative native:compile\n\n# Etapa 2: imagen final mínima — solo el binario, sin JVM ni Maven\nFROM debian:stable-slim\nCOPY --from=build /app/target/app /app/app\nENTRYPOINT [\"/app/app\"]\n```\n\nEl **multi-stage** es la clave del build nativo de GWP: la primera etapa (enorme: trae GraalVM, Maven, todo el toolchain) compila; la segunda **copia solo el binario** a una imagen mínima. Resultado: una imagen chica con un ejecutable que arranca en milisegundos. Por eso GWP puede correr varios pods livianos sin el costo de arranque/RAM de la JVM.\n\n---\n\n### A.2 — Qué es `kubectl` y el \"context\"\n\n`kubectl` es **el cliente de línea de comandos** que le habla al cluster. No \"ejecuta\" nada localmente: manda órdenes al **API server** de Kubernetes por HTTPS y te muestra la respuesta.\n\n¿A qué cluster le habla? Eso lo define el **kubeconfig** (por defecto `~/.kube/config`), que guarda **contexts**: cada context es la terna *(cluster + usuario + namespace por defecto)*. Minikube, al arrancar, te crea y selecciona su context automáticamente.\n\n```bash\nkubectl config current-context     # ¿a qué cluster le estoy hablando?\nkubectl config get-contexts        # todos los contexts disponibles\nkubectl config use-context minikube\n```\n\n> **Por qué te importa:** si alguna vez un comando \"no encuentra\" tus pods, lo primero es chequear que `kubectl` esté apuntando al cluster correcto (el context). Es el equivalente a \"¿me conecté a la base que creía?\".\n\n---\n\n### A.3 — La jerarquía: Deployment → ReplicaSet → Pod\n\nEn la Etapa 7 viste Pod y Deployment sueltos. En realidad hay una **cadena de mando**:\n\n```mermaid\nflowchart TD\n    D[Deployment<br/>'quiero 1 réplica de esta imagen'] --> RS[ReplicaSet<br/>garantiza que haya N pods vivos]\n    RS --> P1[Pod<br/>tu contenedor corriendo]\n    D -. en un update crea .-> RS2[ReplicaSet nuevo<br/>versión nueva]\n    RS2 --> P2[Pod nuevo]\n```\n\n- **Pod** — la unidad mínima: 1 (o más) contenedores que comparten red y viven/mueren juntos. Es **efímero**: si se cae, *ese* pod no \"revive\" — nace **uno nuevo** con otro nombre/IP.\n- **ReplicaSet** — el que **cuenta**: \"tienen que haber N pods vivos\". Si uno muere, levanta otro. Vos casi nunca lo tocás directo.\n- **Deployment** — el que **gestiona versiones**: declarás la imagen y cuántas réplicas; cuando cambiás la imagen (deploy nuevo), el Deployment crea un **ReplicaSet nuevo** y va moviendo pods del viejo al nuevo (**rolling update**), pudiendo hacer **rollback** si algo sale mal.\n\n> **Analogía:** el **Deployment** es el supervisor que dice \"quiero 1 operario haciendo esta tarea, versión 5 del manual\". El **ReplicaSet** es el capataz que se asegura de que **siempre haya 1 operario vivo** (si se desmaya, mete otro). El **Pod** es el operario concreto, reemplazable.\n\n**Por qué \"efímero\" cambia tu forma de pensar:** como los pods van y vienen con IP distinta, **nunca** le hablás a un pod por su IP. Para eso existe el Service (A.5). Y como un pod puede morir en cualquier momento, **su estado en disco se pierde** salvo que uses almacenamiento persistente (A.7) — por eso Postgres no puede ser un Pod común.\n\n---\n\n### A.4 — Labels y selectors (el pegamento de Kubernetes)\n\nAcá está **el mecanismo más importante** y el que la Etapa 7 no abría: **¿cómo sabe un Service a qué pods mandarles tráfico?** No por nombre ni por IP. Por **etiquetas (labels)**.\n\n- Un **label** es un par clave-valor que le pegás a un objeto: `app: payment-service`, `tier: backend`.\n- Un **selector** es una *consulta* por labels: \"todos los pods con `app=payment-service`\".\n\nCasi todas las conexiones de K8s funcionan así: un Deployment sabe qué pods son \"suyos\" por selector; un Service sabe a qué pods rutear por selector.\n\n```yaml\n# Ejemplo ILUSTRATIVO — el Service encuentra a sus pods por label\napiVersion: v1\nkind: Service\nmetadata:\n  name: payment-service\nspec:\n  selector:\n    app: payment-service     # <-- rutea a TODO pod con este label\n  ports:\n    - port: 8080\n```\n\n```mermaid\nflowchart LR\n    SVC[\"Service<br/>selector: app=payment-service\"]\n    SVC --> P1[\"Pod (label app=payment-service)\"]\n    SVC --> P2[\"Pod (label app=payment-service)\"]\n    X[\"Pod (label app=otra-cosa)\"]:::no\n    SVC -. NO rutea .-> X\n    classDef no fill:#f6d6d6,stroke:#b5341a;\n```\n\n> **Analogía:** el selector es un `WHERE label = 'payment-service'`. El Service no tiene una lista fija de pods; **pregunta dinámicamente** \"¿quiénes matchean?\" y reparte entre ellos. Por eso cuando un pod muere y nace otro (con otra IP) el Service **se acomoda solo**: el nuevo pod tiene el mismo label, así que entra a la rotación sin que nadie toque nada.\n\nEsto es lo que hace que el sistema sea *self-healing*: las piezas se encuentran por **identidad lógica (labels)**, no por dirección física.\n\n---\n\n### A.5 — Service y DNS interno (cómo se encuentran los servicios)\n\nUn **Service** te da dos cosas estables sobre un grupo de pods efímeros: una **IP virtual fija** y, sobre todo, un **nombre DNS**. Kubernetes corre un DNS interno: cada Service es resoluble por su nombre **dentro del cluster**.\n\nEsto responde la pregunta que quedaba colgada: *¿cómo sabe el payment-service dónde está PostgreSQL o RabbitMQ?* **Por nombre.** En su configuración, la URL de la base no es una IP: es algo como `postgres-service:5432`, y el de RabbitMQ `rabbitmq-service:5672`. El DNS del cluster traduce ese nombre a la IP del Service, que a su vez reparte a los pods.\n\n```\n# Nombre DNS completo de un Service (forma larga)\n<service>.<namespace>.svc.cluster.local\nej.: postgres-service.dev.svc.cluster.local\n# Dentro del mismo namespace alcanza con el nombre corto: \"postgres-service\"\n```\n\n**Repaso de los tipos** (ya en la Etapa 7), ahora con el \"por qué\":\n- **ClusterIP** (default) — IP/nombre **solo interno**. Es como hablan entre sí los servicios de GWP. No accesible desde afuera.\n- **NodePort** — abre un puerto en el nodo hacia afuera (`:30000` del api-gateway). Es la \"puerta de calle\".\n- **Headless** (`clusterIP: None`) — **no** da una IP única; en cambio expone **un DNS por cada pod** (`rabbitmq-0.<service>...`). Se usa con StatefulSets, donde te importa hablarle a *un pod específico* por su identidad estable, no a \"cualquiera del montón\".\n\n> **Analogía:** el Service es un **número de interno** de la empresa (siempre el mismo) que el conmutador (DNS + balanceo) deriva al empleado disponible. Vos llamás al interno \"Contaduría\", no al celular personal de Juan, que cambia.\n\n---\n\n### A.6 — ConfigMap y Secret: cómo entran de verdad al contenedor\n\nLa Etapa 7 dijo *qué* son. Falta el *cómo*: la config no se \"lee mágicamente\", se **inyecta** al pod de una de dos formas:\n\n1. **Como variables de entorno** — cada clave del ConfigMap/Secret se vuelve un `ENV` que tu app lee (en Spring Boot, eso alimenta tus `@Value`/`application.yml` vía variables de entorno).\n2. **Como archivos en un volumen montado** — el ConfigMap/Secret aparece como archivos dentro del contenedor (ej. `/etc/secrets/webhook-secret`).\n\n```yaml\n# Ejemplo ILUSTRATIVO — inyectar config como env vars\nenvFrom:\n  - configMapRef: { name: payment-config }   # URLs, flags\n  - secretRef:    { name: payment-secrets }  # tokens, passwords\n```\n\n**El malentendido peligroso que tenés que sacarte de encima:** un **Secret NO está encriptado**. Su contenido está en **base64**, que es solo una *codificación* (cualquiera lo decodifica en dos segundos). La diferencia real con un ConfigMap es de **control de acceso y manejo** (RBAC, no se loguea, se puede cifrar en reposo si el cluster lo configura), no de \"está escondido\". Por eso los **tokens de MercadoPago y los webhook secrets por cliente** van en Secrets: para tratarlos con cuidado, no porque base64 los proteja.\n\n```bash\n# Esto \"desencripta\" un Secret... porque nunca estuvo encriptado:\necho \"dG9rZW4tc2VjcmV0bw==\" | base64 -d\n```\n\n---\n\n### A.7 — Persistencia real: PV, PVC y por qué Postgres es un StatefulSet\n\nRecordá A.3: un pod es **efímero**, y lo que escribe en su disco **se borra** cuando muere. Para una base de datos eso es inaceptable. La solución de Kubernetes son **volúmenes persistentes**, con dos piezas:\n\n- **PersistentVolume (PV)** — un pedazo de almacenamiento *real* del cluster (un disco). Existe independientemente de los pods.\n- **PersistentVolumeClaim (PVC)** — un *pedido* de almacenamiento que hace un pod: \"necesito 10Gi\". Kubernetes lo **vincula** a un PV que lo satisfaga. El pod usa el PVC; si el pod muere y nace otro, el nuevo **se reconecta al mismo PVC** y recupera los datos.\n\n```mermaid\nflowchart LR\n    POD[\"Pod postgres-0\"] --> PVC[\"PVC<br/>'quiero 10Gi'\"]\n    PVC --> PV[\"PersistentVolume<br/>(disco real)\"]\n    POD2[\"Pod postgres-0 (recreado)\"] -. se reconecta .-> PVC\n```\n\n**Acá cierra lo del StatefulSet** (de la Etapa 7): un **StatefulSet** existe justamente para cargas con estado. A diferencia de un Deployment, le da a cada pod:\n1. **Identidad estable** — nombres fijos y ordenados (`postgres-0`, `rabbitmq-0`), no aleatorios.\n2. **Su propio PVC persistente** — atado a *ese* pod. Si `postgres-0` se recrea, vuelve a engancharse a su mismo disco. Los datos sobreviven.\n\nPor eso Postgres y RabbitMQ **no pueden** ser Deployments comunes: perderían identidad y datos en cada reinicio. Los microservicios de GWP sí son Deployments porque son **stateless** (su \"estado\" vive en Postgres o en las colas, no en su disco).\n\n> **Analogía:** un Deployment es personal *temporario* intercambiable (cualquiera hace la tarea, no tiene escritorio fijo). Un StatefulSet es personal *con escritorio asignado y archivero propio*: `postgres-0` siempre vuelve a SU archivero (PVC), aunque la persona cambie.\n\n---\n\n### A.8 — Minikube por dentro y el error que SÍ o SÍ vas a tener\n\n**Minikube** no es Kubernetes \"instalado en tu Windows\": es un **cluster de 1 nodo corriendo dentro de una VM o un contenedor** en tu máquina. Tiene **su propio Docker/almacén de imágenes, separado del Docker de tu laptop**. Y ahí está la trampa número uno del que arranca:\n\n> **`ImagePullBackOff` / `ErrImagePull`:** construiste la imagen en *tu* Docker, hacés `kubectl apply`, y el pod queda en `ImagePullBackOff`. ¿Por qué? Porque Minikube busca la imagen en **su** almacén (o en un registry remoto) y **ahí no está**: la imagen vive en el Docker de tu host, que Minikube no ve.\n\nLas salidas habituales (confirmá cuál usa GWP en su documentación de arranque):\n\n```bash\n# Opción A: cargar la imagen de tu host al almacén de Minikube\nminikube image load mi-imagen:tag\n\n# Opción B: construir directamente DENTRO del Docker de Minikube\n#  (apunta tu CLI de Docker al daemon de Minikube en esta shell)\neval $(minikube docker-env)     # en PowerShell: minikube docker-env | Invoke-Expression\ndocker build -t mi-imagen:tag .\n\n# Y que el Deployment NO intente bajarla de internet:\n#   imagePullPolicy: IfNotPresent  (o Never para imágenes 100% locales)\n```\n\nOtros dos comandos de Minikube que te van a servir:\n```bash\nminikube start                       # levanta el cluster\nminikube service <svc> -n dev --url  # te da una URL accesible a un NodePort\nminikube dashboard                   # la UI visual (ya la viste en Etapa 7)\n```\n\n> **Por qué te lo marco fuerte:** este error desconcierta a *todos* los que empiezan (\"¡pero si la imagen existe, la acabo de construir!\"). Entender que Minikube tiene su propio almacén te ahorra una tarde de frustración.\n\n---\n\n### A.9 — Liveness y readiness probes (por qué un pod \"reinicia solo\")\n\nKubernetes no sabe si tu app *está sana* solo porque el proceso vive. Para eso le das **probes**:\n\n- **Liveness probe** — \"¿sigue vivo y sano?\". Si falla repetidamente, K8s **mata y recrea** el pod. Un servicio colgado (deadlock) se recupera solo.\n- **Readiness probe** — \"¿está listo para recibir tráfico?\". Si falla, K8s lo **saca del Service** (no le rutea) hasta que se recupere, sin matarlo. Útil en el arranque o cuando un dependiente (RabbitMQ) todavía no está.\n\n> **Conexión con la Etapa 8:** cuando ves un pod en `CrashLoopBackOff`, muchas veces es una **liveness probe** que falla (la app no levanta bien, o no conecta a RabbitMQ/Postgres) y K8s lo reinicia una y otra vez. `kubectl describe pod` te muestra exactamente qué probe falló.\n\n---\n\n## 🔍 En nuestro sistema (cómo se arma todo junto)\n\nJuntando las piezas, el \"arranque\" mental de GWP en Minikube es:\n\n1. Se **construyen las imágenes** nativas (multi-stage GraalVM) y se ponen al alcance de Minikube (A.1, A.8).\n2. Se **aplican los manifiestos** (`kubectl apply`): se crean Deployments (4 microservicios), StatefulSets (`postgres-0`, `rabbitmq-0`), Services, ConfigMaps y Secrets, todo en el namespace `dev`.\n3. Cada **Deployment** levanta su ReplicaSet → su Pod (A.3). Los **StatefulSets** levantan sus pods con identidad estable y enganchan sus **PVC** (A.7).\n4. Los pods se **encuentran entre sí por Service + DNS** (`rabbitmq-service`, `postgres-service`) usando **labels/selectors** (A.4, A.5).\n5. La config y los secretos (tokens MercadoPago, webhook secrets) se **inyectan** desde ConfigMap/Secret (A.6).\n6. El tráfico externo entra: Nginx → NodePort del api-gateway (`:30000`) → pod (`:8080`).\n\n---\n\n## 📂 Qué buscar en el código / repo (para la semana)\n\n- En cada manifiesto, los **`labels`** (en `metadata.labels`) y los **`selector`** (en Deployments y Services). Verificá que el selector de un Service matchea los labels de los pods del Deployment correspondiente. **Ese match es la conexión.**\n- En los Services, el campo **`type`** (`ClusterIP`/`NodePort`/`clusterIP: None` para headless) y cómo la **config de los microservicios** referencia a `rabbitmq-service`/`postgres-service` **por nombre** (DNS interno).\n- En los StatefulSets, la sección **`volumeClaimTemplates`** (los PVC por pod) y dónde se monta el volumen.\n- En los Deployments, **`imagePullPolicy`** y el nombre/tag de la **imagen** (para entender el tema Minikube de A.8).\n- Las **probes** (`livenessProbe`/`readinessProbe`) en los Deployments: qué endpoint o chequeo usan.\n- El o los **Dockerfile** (multi-stage GraalVM) — confirmá las dos etapas de A.1.\n\n---\n\n## ❓ Preguntas para verificar que entendiste\n\n1. Diferenciá **imagen**, **contenedor** y **registry** con la analogía del `.jar`. ¿Qué rol cumple el multi-stage en el build nativo?\n2. ¿Cómo sabe un **Service** a qué pods mandar tráfico, si las IP de los pods cambian todo el tiempo? Nombrá el mecanismo.\n3. ¿Cómo encuentra el payment-service a PostgreSQL y a RabbitMQ sin conocer sus IP?\n4. Verdadero o falso: \"los datos de un Secret están encriptados\". Justificá y decí cuál es la diferencia real con un ConfigMap.\n5. Explicá por qué Postgres es un **StatefulSet** y no un Deployment, usando los conceptos de **pod efímero** y **PVC**.\n6. Construiste la imagen en tu Docker, hacés `kubectl apply` y el pod queda en `ImagePullBackOff`. ¿Por qué pasa en Minikube y cómo lo resolvés?\n\n---\n\n## ✍️ Mini-ejercicio\n\nTomá el flujo de \"una solicitud de pago entra al sistema\" y, **en una hoja, anotá cada pieza de infraestructura que el tráfico/los datos atraviesan**, en orden: Nginx → NodePort → Service del gateway → pod del gateway → (RabbitMQ por DNS) → ... → payment-service → (Postgres por DNS) → PVC → disco. Al lado de cada salto, escribí **qué concepto de este apéndice explica ese salto** (label/selector, DNS interno, PVC, etc.). El objetivo: que la palabra \"infraestructura\" deje de ser una caja negra y se vuelva una cadena de piezas que podés nombrar.\n\n---\n\n**Las respuestas están en `99-respuestas.md` (sección Apéndice A).**\n\n**Siguiente:** `99-respuestas.md`\n","# Respuestas a las preguntas de verificación\n\n> Leé estas respuestas **después** de intentar las preguntas vos. Son guías, no dogma: si tu redacción dice lo mismo con otras palabras, está perfecto.\n\n---\n\n## Etapa 0 — Por qué eventos\n\n1. **Disponibilidad atada a MercadoPago.** Porque en el monolito la llamada a MercadoPago es **sincrónica y bloqueante** dentro del request: si MercadoPago tarda o está caído, tu endpoint tarda o falla, aunque la solicitud era válida. GWP rompe la atadura porque el gateway **publica un evento y responde `202` al instante**; hablar con MercadoPago pasa a ser tarea asíncrona del adapter, que reintenta cuando el proveedor vuelve. La disponibilidad del gateway ya no depende de la de MercadoPago.\n\n2. **`202` vs `200`.** `200 OK` dice \"terminé, acá está el resultado\". `202 Accepted` dice \"**recibí tu pedido y me hago cargo**, pero todavía no terminé\". Es honesto con la naturaleza asíncrona: el resultado (el QR, la confirmación) llega después, por el webhook del cliente.\n\n3. **Los cuatro problemas:** acoplamiento temporal, escalado en bloque, fallos en cascada y asincronía artesanal (a mano con `BlockingQueue`/`Executor`, sin durabilidad).\n\n4. **El costo principal** es la **consistencia eventual** (más debugging distribuido y complejidad operativa). Vale la pena en pagos porque **no perder un mensaje** y **no caerse cuando un proveedor se cae** importan más que la simplicidad de un monolito; el sistema converge a un estado correcto sin perder información.\n\n5. **`BlockingQueue` ≠ RabbitMQ** porque la `BlockingQueue` vive en el **heap de tu proceso**: si el proceso muere, los ítems se pierden, no hay ack/nack ni reintento garantizado, no es compartible entre servicios ni durable. RabbitMQ es externo, durable, con entrega garantizada (at-least-once) y DLQ.\n\n---\n\n## Etapa 1 — Vocabulario de mensajería\n\n1. **Productor → exchange (no a la cola)** para **desacoplar** al productor de los consumidores: no necesita saber cuántas colas hay ni quién consume. Agregás/quitás consumidores cambiando bindings, sin tocar al productor. La indirección es lo que da la flexibilidad de ruteo.\n\n2. **`fanout` con rk `\"\"`:** en fanout la routing key **se ignora** (por eso va vacía); el mensaje se copia a todas las colas atadas. Para sumar un consumidor nuevo, **atás otra cola** al exchange y listo — el gateway ni se entera.\n\n3. **ack vs nack:** ack = \"procesado OK, el broker borra el mensaje\"; nack = \"falló, se re-encola o va a DLQ según config\". Si el consumidor **se cae antes de ack o nack**, el broker detecta la conexión muerta y **redan** el mensaje a otro consumidor (no se pierde).\n\n4. **at-least-once ⇒ idempotencia** porque, como un mensaje puede entregarse **más de una vez** (caída antes del ack, redelivery, reintentos, Outbox que republica), procesarlo dos veces no debe duplicar efectos. La única forma segura es que el procesamiento sea idempotente.\n\n5. **DLQ** aísla los mensajes que fallan repetidamente para que **un poison message no gire infinito bloqueando la cola** ni se pierda. Quedan apartados y visibles para inspección humana.\n\n---\n\n## Etapa 2 — RabbitMQ en este proyecto\n\n1. **Beans de topología:** al arrancar, un `RabbitAdmin` **crea en el broker** los exchanges/colas/bindings declarados (si no existen). Conviene en código porque la topología queda **versionada, reproducible y revisable**, no dependiente de clicks manuales que nadie recuerda.\n\n2. **Ack con `auto`:** lo hace **Spring** (el listener container) automáticamente: si el método retorna sin excepción → **ack**; si lanza excepción → **nack** (y según config, re-encola o DLQ).\n\n3. **JSON, no objetos Java**, porque los servicios son **procesos/contenedores separados** que no comparten memoria; el contrato común es el JSON sobre el cable. Implica que cambiar un campo de un evento es un **cambio de contrato**: todos los consumidores tienen que entender la nueva forma (versionado de eventos).\n\n4. **5.000 ready, 0 unacked:** no hay **consumidor vivo** tomando mensajes (o todos están desconectados). Los mensajes entran y se acumulan porque nadie los consume.\n\n5. **`max-concurrency`** define cuántos consumidores concurrentes puede levantar un listener cuando hay backlog. Se relaciona con el escalado de la Etapa 0: permite **procesar más rápido la cola saturada** sumando consumidores, sin escalar el resto.\n\n---\n\n## Etapa 3 — Hexagonal + Clean + CQRS\n\n1. **Dominio sin Spring/JPA/RabbitMQ** para que la **lógica de negocio sea pura y testeable sin infraestructura** (le pasás mocks de los puertos) y para poder **cambiar base/broker/proveedor sin tocar el negocio**. Ganás testeo rápido y resistencia al cambio.\n\n2. **Puerto de entrada:** cómo el mundo externo dispara el negocio — en el payment-service, los `@RabbitListener` que reciben eventos. **Puerto de salida:** lo que el negocio necesita del mundo — el repositorio PostgreSQL y el publicador de eventos. (Los adapters los implementan.)\n\n3. **Command / Event / Query:** command = \"hacé esto\" (puede rechazarse, imperativo); event = \"esto ya pasó\" (hecho inmutable, pasado); query = \"decime esto\" (sin efectos). `OnPaymentRequestReceivedEvent` es un **evento** porque describe un **hecho consumado** (se recibió la solicitud), no una orden que alguien pueda rechazar.\n\n4. **Dependencias:** `adapters → application → domain`, **nunca al revés**. Así el dominio no conoce detalles externos y se mantiene puro y estable; lo volátil (frameworks, proveedores) queda en los bordes.\n\n5. **Commands `record` inmutables** porque se **serializan y pasan entre hilos/servicios**: la inmutabilidad los hace seguros para concurrencia (no hay estado mutable compartido) y predecibles (una vez creado el command, su contenido no cambia).\n\n---\n\n## Etapa 4 — Recorrido de los 4 microservicios\n\n1. **Gateway sin BD, payment-service con BD:** el gateway solo **traduce HTTP→evento** y no es dueño de ningún estado, así que no necesita base (es stateless y escalable trivialmente). El payment-service es el **Aggregate Root**: dueño de la verdad del estado de cada pago, por eso necesita persistencia (PostgreSQL).\n\n2. **Cómo le llegan cosas al payment-service:** (a) por **mensajes** de las 9 colas que consume, y (b) por sus **schedulers internos** (`ExpiredOrdersScheduler` 5s, `RefundInProgressScheduler` 60s) — el tiempo como disparador.\n\n3. **El adapter encapsula** lo del proveedor: por ejemplo, el **formato de la API REST de MercadoPago** (endpoints, payloads), la **autenticación con token/secret por cliente**, la **validación de firma HMAC**, y los **reintentos/DLQ**. El resto del sistema no debería conocer nada de eso.\n\n4. **Strategy de los 12 extractores:** evita un `switch`/`if-else` gigante por proveedor. Cada proveedor tiene **su implementación** de la interfaz \"extractor de metadatos\", elegida en runtime. Agregar un proveedor = **una clase nueva**, sin tocar las otras ni arriesgar regresiones.\n\n5. **`on_notification_attempt_completed`** es **auditoría**: registra el resultado de cada intento de notificación (exitoso o no). No hace falta para el \"happy path\", pero da trazabilidad, métricas y soporte (¿le avisamos al cliente?, ¿cuántos reintentos?, ¿falló?).\n\n---\n\n## Etapa 5 — Patrones\n\n1. **Dual write:** hay que escribir a **dos sistemas** (PostgreSQL + RabbitMQ) que no comparten transacción. Un `@Transactional` solo cubre la base; si la app cae **entre el commit y el publish**, guardaste el estado pero **perdiste el evento** (o publicaste un evento sobre algo que no se commiteó). No hay atomicidad entre los dos sistemas.\n\n2. **Outbox = single write:** el evento se inserta en `outbox_events` **en la misma transacción** que la entidad → una sola escritura atómica. La publicación real se hace después (publish inmediato vía `ApplicationEvent`); si falla, el **scheduler de respaldo (3s, máx 3 intentos)** publica los pendientes desde la tabla. El evento **nunca se pierde**.\n\n3. **at-least-once ⇒ idempotencia:** porque el mismo mensaje puede llegar varias veces. Idempotente: \"confirmar la orden #123\" (queda confirmada una vez, lleguen 1 o 3 avisos). No idempotente: \"sumar $100 al saldo\" (3 entregas = +$300). En pagos, lo segundo sería cobrar de más.\n\n4. **Consistencia eventual:** el sistema no está coherente en *todo instante*, pero **converge** al rato. Es aceptable porque a cambio ganás desacople y disponibilidad sin transacciones distribuidas. Se nota, por ejemplo, en la ventana entre que el payment-service **confirma** el pago y el notification-service **avisa** al cliente.\n\n5. **A la DLQ** llega un mensaje que **falla repetidamente** (se agotan reintentos) o se rechaza sin re-encolar. Una DLQ que **crece es alarma** porque significa que hay mensajes que ningún reintento pudo procesar: bug, dato inválido o dependiente caído — requiere intervención humana.\n\n---\n\n## Etapa 6 — Flujos end-to-end\n\n1. **Flujo 1, respuesta al cliente:** el cliente recibe **`202` en el paso 1**, apenas el gateway publica el evento (mucho antes de que el QR exista). Se entera de que el QR está listo **por su webhook**, cuando el notification-service le manda el POST firmado.\n\n2. **`GET /v1/orders/{id}` en vez de confiar en el webhook:** porque el webhook es solo un **aviso** (puede ser falsificado, llegar duplicado o estar incompleto). El adapter **valida la firma HMAC** y luego **consulta el estado real** a MercadoPago para actuar sobre el dato autoritativo, no sobre el aviso.\n\n3. **Flujo 3 lo dispara un scheduler** del payment-service (`ExpiredOrdersScheduler` 5s / `RefundInProgressScheduler` 60s): el disparador es **el tiempo**, no un request HTTP. Eso lo distingue de los demás, que arrancan con una acción del cliente o de MercadoPago.\n\n4. **`RefundInProgressScheduler` (60s):** MercadoPago puede procesar reembolsos de forma **asíncrona**, dejándolos \"en progreso\". El scheduler hace un **loop de consulta** periódica del estado hasta que el reembolso se cierra, para que el sistema no quede esperando indefinidamente un aviso que quizá no llega.\n\n5. **Los 5 casilleros de cualquier salto:** (1) **evento** emitido, (2) **exchange**, (3) **routing key**, (4) **cola** destino, (5) **caso de uso/consumidor** que lo procesa.\n\n---\n\n## Etapa 7 — Infraestructura\n\n1. **StatefulSets** porque RabbitMQ y PostgreSQL tienen **estado e identidad estable**: necesitan nombre fijo (`rabbitmq-0`, `postgres-0`) y **almacenamiento persistente** que sobreviva reinicios. Un Deployment común trata a los pods como intercambiables y efímeros, lo que rompería una base o un broker.\n\n2. **NodePort vs ClusterIP:** NodePort **expone un puerto hacia afuera** del cluster (accesible desde el nodo); ClusterIP es **solo interno**. El api-gateway usa NodePort (`:30000`→`:8080`) porque es el **único punto de entrada HTTP** y tiene que ser alcanzable desde afuera (vía Nginx).\n\n3. **`port-forward 15672`** abre un túnel desde tu `localhost:15672` a la UI de Management de RabbitMQ. Una vez conectado, mirás **exchanges (tipos/bindings)** y **colas (profundidad, ready/unacked)** para ver el sistema en vivo y diagnosticar.\n\n4. **Cola del payment-service crece, la del adapter en 0:** el **payment-service no está consumiendo** (caído, en `CrashLoopBackOff`, o lanzando excepciones en loop). Confirmás con `kubectl get pods -n dev` y `kubectl logs -n dev <pod-payment-service>`.\n\n5. **Tokens y webhook secrets por cliente** viven en **Secrets** de Kubernetes (no en ConfigMaps) porque son **datos sensibles**; los Secrets están pensados para credenciales (control de acceso, no se exponen como config plana).\n\n---\n\n## Etapa 8 — Consolidar\n\n1. **Agregar \"PagoYa\":** el que **más cambia** es un **nuevo adapter** (`pagoya-adapter`) que encapsula todo lo del proveedor. El **api-gateway** casi no cambia (solo un **binding** nuevo por la routing key del proveedor en el exchange topic). El **payment-service** casi no cambia (razona en eventos de dominio genéricos). El **notification-service** suma **una Strategy** (un extractor) si la metadata difiere.\n\n2. **El webhook debe ser `topic`** porque la routing key es el `providerCode`: con topic podés **agregar un binding** para rutear las notificaciones del proveedor nuevo a su propia cola **sin tocar el gateway**. Con `fanout` todas las colas recibirían todo (no podrías separar por proveedor) y con `direct` igual sirve por key exacta, pero `topic` da la flexibilidad de patrones por si mañana querés agrupar proveedores.\n\n3. **Investigar la DLQ:** (1) abrir un mensaje en la UI (payload + headers `x-death` con el motivo), (2) cruzar con los **logs del consumidor** en la ventana del fallo, (3) decidir bug (fix + reproceso) vs dato inválido (descartar).\n\n4. **`ready` alto + `unacked` 0:** no hay consumidor vivo tomando mensajes. **`unacked` alto y estable:** el consumidor **tomó** mensajes pero **no ackea** — está colgado/lento procesando (probablemente esperando a un tercero o trabado).\n\n5. **Evento que no llega — el camino:** recorrer **productor → exchange → binding → cola → consumidor**, preguntando en cada salto \"¿llegó hasta acá?\". Chequear: ¿publicó? (logs / `outbox_events`), ¿el binding/routing key es correcto? (UI Exchanges), ¿la cola tiene consumidor? (Síntoma 2), ¿terminó en la DLQ? (Síntoma 1). El primer \"no\" marca el problema.\n\n---\n\n## Apéndice A — Fundamentos de Docker y Kubernetes\n\n1. **Imagen / contenedor / registry:** la **imagen** es la plantilla inmutable (como el `.jar` empaquetado con la JVM y el SO mínimo: el plato servido entero); el **contenedor** es esa imagen **en ejecución** (el `.jar` corriendo); el **registry** es el repositorio de imágenes (tu Nexus/Artifactory, pero de imágenes). El **multi-stage** separa el build del runtime: la primera etapa (pesada: GraalVM + toolchain) **compila el binario nativo**, la segunda **copia solo el binario** a una imagen mínima → imagen chica que arranca en milisegundos.\n\n2. **Cómo el Service encuentra a sus pods:** por **labels y selectors**, no por IP. El Service tiene un `selector` (ej. `app=payment-service`) y rutea dinámicamente a **todo pod que matchee ese label**. Cuando un pod muere y nace otro con el mismo label, entra solo a la rotación: por eso el sistema es *self-healing* y nadie toca IPs.\n\n3. **Cómo encuentra el payment-service a Postgres/RabbitMQ:** por el **DNS interno** del cluster. En su config no hay IPs sino **nombres de Service** (`postgres-service:5432`, `rabbitmq-service:5672`); el DNS resuelve ese nombre a la IP del Service, que reparte a los pods.\n\n4. **Falso.** Un Secret está en **base64**, que es solo *codificación* (se decodifica trivialmente, no es cifrado). La diferencia real con un ConfigMap es de **manejo y control de acceso** (RBAC, no se loguea, se puede cifrar en reposo si el cluster lo habilita), no de ocultamiento. Por eso los tokens/webhook secrets van en Secret: para tratarlos con cuidado, no porque base64 los proteja.\n\n5. **Postgres como StatefulSet:** un Pod es **efímero** — si muere, nace otro con otra IP y **su disco se pierde**. Una base no puede perder datos en cada reinicio. El **StatefulSet** le da al pod **identidad estable** (`postgres-0`) y un **PVC** propio atado a él: si `postgres-0` se recrea, **se reconecta al mismo PVC/disco** y recupera los datos. Un Deployment trata a los pods como intercambiables y sin disco propio, así que no sirve para estado.\n\n6. **`ImagePullBackOff` en Minikube:** porque Minikube corre en su **propia VM/contenedor con su propio almacén de imágenes**, separado del Docker de tu host. Construiste la imagen en *tu* Docker; Minikube la busca en *el suyo* (o en un registry remoto) y no la encuentra. Se resuelve **cargándola** (`minikube image load <img>`), **construyéndola dentro del Docker de Minikube** (`minikube docker-env` + `docker build`), y poniendo `imagePullPolicy: IfNotPresent`/`Never` para que no intente bajarla de internet.\n"];
  marked.setOptions({ gfm: true, breaks: false });
  const container = document.getElementById("content");
  for (const md of DOCS) {
    const div = document.createElement("div");
    div.className = "doc";
    div.innerHTML = marked.parse(md);
    container.appendChild(div);
  }
  // Reemplazar bloques ```mermaid por divs que mermaid pueda renderizar
  document.querySelectorAll("code.language-mermaid").forEach((code) => {
    const pre = code.closest("pre");
    const div = document.createElement("div");

    pre.replaceWith(div);

  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
